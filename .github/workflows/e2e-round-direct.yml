name: Round direct E2E

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: '세 Preview 앱이 가리켜야 하는 40자리 commit SHA'
        required: true
        type: string
      consumer_deployment_id:
        description: 'consumer의 직접 검증 대상 Vercel deployment ID'
        required: true
        type: string
      seller_deployment_id:
        description: 'seller의 직접 검증 대상 Vercel deployment ID'
        required: true
        type: string
      driver_deployment_id:
        description: 'driver의 직접 검증 대상 Vercel deployment ID'
        required: true
        type: string
      approval:
        description: '비운영 회차 E2E 실행을 승인합니다.'
        required: true
        type: choice
        options:
          - NON_PRODUCTION_E2E_APPROVED

concurrency:
  group: round-direct-e2e
  cancel-in-progress: false

jobs:
  approval_gate:
    name: 비운영 E2E 승인 사전 검증
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: workflow dispatch·실행자·승인·SHA 사전 검증
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          APPROVAL: ${{ inputs.approval }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONSUMER_DEPLOYMENT_ID: ${{ inputs.consumer_deployment_id }}
          SELLER_DEPLOYMENT_ID: ${{ inputs.seller_deployment_id }}
          DRIVER_DEPLOYMENT_ID: ${{ inputs.driver_deployment_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf 'run_id=%s\n' "$RUN_ID"
          printf 'run_attempt=%s\n' "$RUN_ATTEMPT"
          printf 'event_name=%s\n' "$EVENT_NAME"
          printf 'actor=%s\n' "$ACTOR"
          printf 'triggering_actor=%s\n' "$TRIGGERING_ACTOR"
          printf 'repository_owner=%s\n' "$REPOSITORY_OWNER"
          printf 'workflow_sha=%s\n' "$WORKFLOW_SHA"
          printf 'expected_sha=%s\n' "$EXPECTED_SHA"
          if [[ "$EVENT_NAME" != 'workflow_dispatch' ]]; then
            echo 'workflow_dispatch 이외의 이벤트에서는 비운영 E2E를 실행할 수 없습니다.' >&2
            exit 1
          fi
          if [[ "$ACTOR" != "$REPOSITORY_OWNER" ]]; then
            echo 'workflow 실행자가 repository owner와 달라 실행을 차단합니다.' >&2
            exit 1
          fi
          if [[ "$TRIGGERING_ACTOR" != "$REPOSITORY_OWNER" ]]; then
            echo 'workflow triggering actor가 repository owner와 달라 실행을 차단합니다.' >&2
            exit 1
          fi
          if [[ "$APPROVAL" != 'NON_PRODUCTION_E2E_APPROVED' ]]; then
            echo '비운영 E2E 수동 승인이 없어 실행을 차단합니다.' >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '지정 SHA는 40자리 소문자 16진수여야 합니다.' >&2
            exit 1
          fi
          for deployment_id in \
            "$CONSUMER_DEPLOYMENT_ID" \
            "$SELLER_DEPLOYMENT_ID" \
            "$DRIVER_DEPLOYMENT_ID"; do
            if [[ ! "$deployment_id" =~ ^dpl_[A-Za-z0-9]+$ ]]; then
              echo 'pinned Vercel deployment ID 형식이 올바르지 않습니다.' >&2
              exit 1
            fi
          done

  e2e:
    name: 지정 SHA 회차 직배송 E2E
    needs: approval_gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      # 현재 private 저장소 plan에서는 native required reviewer를 사용할 수 없다.
      # secret 범위는 Environment에 두고, 위 single-operator preflight가 fail-closed 승인 계약을 강제한다.
      name: round-direct-e2e
    permissions:
      contents: read
    env:
      ROUND_DIRECT_E2E_ENABLED: 'true'
      ROUND_DIRECT_E2E_ENV: preview
      ROUND_DIRECT_E2E_EXPECTED_SHA: ${{ inputs.expected_sha }}
      ROUND_DIRECT_E2E_CONSUMER_DEPLOYMENT_ID: ${{ inputs.consumer_deployment_id }}
      ROUND_DIRECT_E2E_SELLER_DEPLOYMENT_ID: ${{ inputs.seller_deployment_id }}
      ROUND_DIRECT_E2E_DRIVER_DEPLOYMENT_ID: ${{ inputs.driver_deployment_id }}
      ROUND_DIRECT_E2E_RUN_ID: task-6-7-${{ github.run_id }}-${{ github.run_attempt }}
      ROUND_DIRECT_E2E_RUN_ATTEMPT: ${{ github.run_attempt }}
      ROUND_DIRECT_E2E_EVENT_NAME: ${{ github.event_name }}
      ROUND_DIRECT_E2E_ACTOR: ${{ github.actor }}
      ROUND_DIRECT_E2E_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      ROUND_DIRECT_E2E_WORKFLOW_SHA: ${{ github.sha }}
      ROUND_DIRECT_E2E_PROVIDER_MODE: stub
      ROUND_DIRECT_E2E_FIXTURE_PROJECTS: chromium,mobile
      ROUND_DIRECT_E2E_CLEANUP_CONFIGURED: 'true'
      ROUND_DIRECT_E2E_API_ORIGIN: ${{ vars.ROUND_DIRECT_E2E_API_ORIGIN }}
      ROUND_DIRECT_E2E_ALLOWED_API_ORIGINS: ${{ vars.ROUND_DIRECT_E2E_ALLOWED_API_ORIGINS }}
      FIREBASE_PROJECT_ID: ${{ vars.ROUND_DIRECT_E2E_FIREBASE_PROJECT_ID }}
      ROUND_DIRECT_E2E_ALLOWED_FIREBASE_PROJECTS: ${{ vars.ROUND_DIRECT_E2E_ALLOWED_FIREBASE_PROJECTS }}
      FIREBASE_STORAGE_BUCKET: ${{ vars.ROUND_DIRECT_E2E_STORAGE_BUCKET }}
      ROUND_DIRECT_E2E_ALLOWED_STORAGE_BUCKETS: ${{ vars.ROUND_DIRECT_E2E_ALLOWED_STORAGE_BUCKETS }}
      ROUND_DIRECT_E2E_STORAGE_PREFIX: e2e/round-direct/task-6-7-${{ github.run_id }}-${{ github.run_attempt }}/
      ROUND_DIRECT_E2E_STORE_ID: round-direct-e2e-task-6-7-${{ github.run_id }}-${{ github.run_attempt }}-chromium-store
      ROUND_DIRECT_E2E_FIXTURE_MANIFEST: .artifacts/round-direct/task-6-7-${{ github.run_id }}-${{ github.run_attempt }}/chromium/manifest.json
      ROUND_DIRECT_E2E_PROVIDER_EGRESS_HOSTS: ''
      PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/.artifacts/round-direct/task-6-7-${{ github.run_id }}-${{ github.run_attempt }}/playwright-raw.json

    steps:
      - name: candidate workflow SHA checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: 수동 승인과 application/candidate SHA 확인
        shell: bash
        env:
          APPROVAL: ${{ inputs.approval }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != 'workflow_dispatch' ]]; then
            echo 'workflow_dispatch 이외의 이벤트에서는 비운영 E2E를 실행할 수 없습니다.' >&2
            exit 1
          fi
          if [[ "$ACTOR" != "$REPOSITORY_OWNER" ]]; then
            echo 'workflow 실행자가 repository owner와 달라 실행을 차단합니다.' >&2
            exit 1
          fi
          if [[ "$TRIGGERING_ACTOR" != "$REPOSITORY_OWNER" ]]; then
            echo 'workflow triggering actor가 repository owner와 달라 실행을 차단합니다.' >&2
            exit 1
          fi
          if [[ "$APPROVAL" != 'NON_PRODUCTION_E2E_APPROVED' ]]; then
            echo '비운영 E2E 수동 승인이 없어 실행을 차단합니다.' >&2
            exit 1
          fi
          if [[ ! "$ROUND_DIRECT_E2E_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '지정 SHA는 40자리 소문자 16진수여야 합니다.' >&2
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$WORKFLOW_SHA" ]]; then
            echo 'checkout SHA가 workflow candidate SHA와 달라 실행을 차단합니다.' >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$ROUND_DIRECT_E2E_EXPECTED_SHA" "$WORKFLOW_SHA"; then
            echo 'application SHA가 candidate workflow의 조상이 아니어서 실행을 차단합니다.' >&2
            exit 1
          fi
          required_candidate_paths=(
            '.github/workflows/e2e-round-direct.yml'
            '.github/workflows/sync-preview.yml'
            'scripts/wait-preview-deploy.mjs'
            'scripts/wait-preview-deploy.spec.mjs'
            'scripts/check-round-direct-e2e-readiness.spec.mjs'
          )
          mapfile -t candidate_paths < <(
            git diff --name-only "$ROUND_DIRECT_E2E_EXPECTED_SHA" "$WORKFLOW_SHA"
          )
          for required_path in "${required_candidate_paths[@]}"; do
            if [[ ! " ${candidate_paths[*]} " == *" $required_path "* ]]; then
              echo "candidate에 필요한 CI gate 파일이 없어 실행을 차단합니다: $required_path" >&2
              exit 1
            fi
          done
          for candidate_path in "${candidate_paths[@]}"; do
            case "$candidate_path" in
              .github/workflows/e2e-round-direct.yml|\
              .github/workflows/sync-preview.yml|\
              scripts/wait-preview-deploy.mjs|\
              scripts/wait-preview-deploy.spec.mjs|\
              scripts/check-round-direct-e2e-readiness.spec.mjs)
                ;;
              *)
                echo "application SHA와 candidate 사이에 허용되지 않은 변경이 있어 실행을 차단합니다: $candidate_path" >&2
                exit 1
                ;;
            esac
          done

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 세 pinned Vercel deployment metadata 직접 확인
        shell: bash
        env:
          ROUND_DIRECT_E2E_VERCEL_READ_TOKEN: ${{ secrets.ROUND_DIRECT_E2E_VERCEL_READ_TOKEN }}
        run: |
          set -euo pipefail
          evidence_root=".artifacts/round-direct/$ROUND_DIRECT_E2E_RUN_ID"
          mkdir -p "$evidence_root/evidence"
          set +e
          node scripts/wait-preview-deploy.mjs \
            --json \
            --sha="$ROUND_DIRECT_E2E_EXPECTED_SHA" \
            --consumer-deployment-id="$ROUND_DIRECT_E2E_CONSUMER_DEPLOYMENT_ID" \
            --seller-deployment-id="$ROUND_DIRECT_E2E_SELLER_DEPLOYMENT_ID" \
            --driver-deployment-id="$ROUND_DIRECT_E2E_DRIVER_DEPLOYMENT_ID" \
            > "$evidence_root/deployment-raw.json"
          wait_status=$?
          set -e
          if [[ ! -s "$evidence_root/deployment-raw.json" ]]; then
            echo '배포 증거 JSON을 만들지 못해 실행을 차단합니다.' >&2
            exit 1
          fi
          jq -c '.deploymentShas' "$evidence_root/deployment-raw.json" \
            | sed 's/^/ROUND_DIRECT_E2E_DEPLOYMENT_SHAS_JSON=/' >> "$GITHUB_ENV"
          jq -c '.deploymentTargetUrls' "$evidence_root/deployment-raw.json" \
            | sed 's/^/ROUND_DIRECT_E2E_TARGET_URLS_JSON=/' >> "$GITHUB_ENV"
          if [[ "$wait_status" -eq 0 ]]; then
            jq -er '.deploymentTargetUrls.consumer' "$evidence_root/deployment-raw.json" \
              | sed 's/^/CONSUMER_BASE=/' >> "$GITHUB_ENV"
            jq -er '.deploymentTargetUrls.seller' "$evidence_root/deployment-raw.json" \
              | sed 's/^/SELLER_BASE=/' >> "$GITHUB_ENV"
            jq -er '.deploymentTargetUrls.driver' "$evidence_root/deployment-raw.json" \
              | sed 's/^/DRIVER_BASE=/' >> "$GITHUB_ENV"
          fi
          jq '{
            ready,
            evidenceSource,
            checkedAt,
            repository,
            expectedSha,
            pinnedDeploymentIds,
            deploymentIds,
            deploymentShas,
            deploymentTargetUrls,
            deploymentStates,
            failureCodes,
            apps: [.apps[] | {
              app,
              project,
              projectId,
              environment,
              deploymentId,
              deploymentSha,
              state,
              readyState,
              target,
              target_url: .targetUrl,
              failureCode,
              ready
            }]
            }' \
            "$evidence_root/deployment-raw.json" \
            > "$evidence_root/evidence/deployment.json"
          exit "$wait_status"

      - name: 비운영 readiness 확인
        shell: bash
        env:
          ROUND_DIRECT_E2E_SHARED_SECRET: ${{ secrets.ROUND_DIRECT_E2E_SHARED_SECRET }}
          ROUND_DIRECT_E2E_AUTH_EVIDENCE_JSON: ${{ secrets.ROUND_DIRECT_E2E_AUTH_EVIDENCE_JSON }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.ROUND_DIRECT_E2E_FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          evidence_root=".artifacts/round-direct/$ROUND_DIRECT_E2E_RUN_ID"
          node scripts/check-round-direct-e2e-readiness.mjs \
            > "$evidence_root/evidence/readiness.json"

      - name: Playwright chromium 설치
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: chromium fixture seed
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.ROUND_DIRECT_E2E_FIREBASE_SERVICE_ACCOUNT_JSON }}
          TEST_CONSUMER_EMAIL_CHROMIUM: ${{ secrets.ROUND_DIRECT_E2E_CONSUMER_EMAIL_CHROMIUM }}
          TEST_CONSUMER_PASSWORD_CHROMIUM: ${{ secrets.ROUND_DIRECT_E2E_CONSUMER_PASSWORD_CHROMIUM }}
          TEST_SELLER_EMAIL_CHROMIUM: ${{ secrets.ROUND_DIRECT_E2E_SELLER_EMAIL_CHROMIUM }}
          TEST_SELLER_PASSWORD_CHROMIUM: ${{ secrets.ROUND_DIRECT_E2E_SELLER_PASSWORD_CHROMIUM }}
          TEST_DRIVER_EMAIL_CHROMIUM: ${{ secrets.ROUND_DIRECT_E2E_DRIVER_EMAIL_CHROMIUM }}
          TEST_DRIVER_PASSWORD_CHROMIUM: ${{ secrets.ROUND_DIRECT_E2E_DRIVER_PASSWORD_CHROMIUM }}
        run: |
          set -euo pipefail
          evidence_root=".artifacts/round-direct/$ROUND_DIRECT_E2E_RUN_ID"
          node scripts/round-direct-e2e-fixtures.mjs seed \
            --project=chromium \
            --manifest="$evidence_root/chromium/manifest.json" \
            > "$evidence_root/seed-chromium-raw.json"
          jq '{action, runId, project, ready, missingCount: (.missingDocuments | length)}' \
            "$evidence_root/seed-chromium-raw.json" \
            > "$evidence_root/evidence/seed-chromium.json"

      - name: chromium fixture verify
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.ROUND_DIRECT_E2E_FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          evidence_root=".artifacts/round-direct/$ROUND_DIRECT_E2E_RUN_ID"
          node scripts/round-direct-e2e-fixtures.mjs verify \
            --project=chromium \
            --manifest="$evidence_root/chromium/manifest.json" \
            > "$evidence_root/verify-chromium-raw.json"
          jq '{action, runId, project, ready, missingCount: (.missingDocuments | length)}' \
            "$evidence_root/verify-chromium-raw.json" \
            > "$evidence_root/evidence/verify-chromium.json"

      - name: mobile fixture seed
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.ROUND_DIRECT_E2E_FIREBASE_SERVICE_ACCOUNT_JSON }}
          TEST_CONSUMER_EMAIL_MOBILE: ${{ secrets.ROUND_DIRECT_E2E_CONSUMER_EMAIL_MOBILE }}
          TEST_CONSUMER_PASSWORD_MOBILE: ${{ secrets.ROUND_DIRECT_E2E_CONSUMER_PASSWORD_MOBILE }}
          TEST_SELLER_EMAIL_MOBILE: ${{ secrets.ROUND_DIRECT_E2E_SELLER_EMAIL_MOBILE }}
          TEST_SELLER_PASSWORD_MOBILE: ${{ secrets.ROUND_DIRECT_E2E_SELLER_PASSWORD_MOBILE }}
          TEST_DRIVER_EMAIL_MOBILE: ${{ secrets.ROUND_DIRECT_E2E_DRIVER_EMAIL_MOBILE }}
          TEST_DRIVER_PASSWORD_MOBILE: ${{ secrets.ROUND_DIRECT_E2E_DRIVER_PASSWORD_MOBILE }}
        run: |
          set -euo pipefail
          evidence_root=".artifacts/round-direct/$ROUND_DIRECT_E2E_RUN_ID"
          node scripts/round-direct-e2e-fixtures.mjs seed \
            --project=mobile \
            --manifest="$evidence_root/mobile/manifest.json" \
            > "$evidence_root/seed-mobile-raw.json"
          jq '{action, runId, project, ready, missingCount: (.missingDocuments | length)}' \
            "$evidence_root/seed-mobile-raw.json" \
            > "$evidence_root/evidence/seed-mobile.json"

      - name: mobile fixture verify
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.ROUND_DIRECT_E2E_FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          evidence_root=".artifacts/round-direct/$ROUND_DIRECT_E2E_RUN_ID"
          node scripts/round-direct-e2e-fixtures.mjs verify \
            --project=mobile \
            --manifest="$evidence_root/mobile/manifest.json" \
            > "$evidence_root/verify-mobile-raw.json"
          jq '{action, runId, project, ready, missingCount: (.missingDocuments | length)}' \
            "$evidence_root/verify-mobile-raw.json" \
            > "$evidence_root/evidence/verify-mobile.json"

      - name: 소비자·셀러·드라이버 52건 실행
        id: e2e
        env:
          SELLER_BYPASS_SECRET: ${{ secrets.ROUND_DIRECT_E2E_SELLER_BYPASS_SECRET }}
          CONSUMER_BYPASS_SECRET: ${{ secrets.ROUND_DIRECT_E2E_CONSUMER_BYPASS_SECRET }}
          DRIVER_BYPASS_SECRET: ${{ secrets.ROUND_DIRECT_E2E_DRIVER_BYPASS_SECRET }}
          E2E_TEST_SECRET: ${{ secrets.ROUND_DIRECT_E2E_TEST_SECRET }}
          ROUND_DIRECT_E2E_SHARED_SECRET: ${{ secrets.ROUND_DIRECT_E2E_SHARED_SECRET }}
          TEST_CONSUMER_EMAIL_CHROMIUM: ${{ secrets.ROUND_DIRECT_E2E_CONSUMER_EMAIL_CHROMIUM }}
          TEST_CONSUMER_PASSWORD_CHROMIUM: ${{ secrets.ROUND_DIRECT_E2E_CONSUMER_PASSWORD_CHROMIUM }}
          TEST_SELLER_EMAIL_CHROMIUM: ${{ secrets.ROUND_DIRECT_E2E_SELLER_EMAIL_CHROMIUM }}
          TEST_SELLER_PASSWORD_CHROMIUM: ${{ secrets.ROUND_DIRECT_E2E_SELLER_PASSWORD_CHROMIUM }}
          TEST_DRIVER_EMAIL_CHROMIUM: ${{ secrets.ROUND_DIRECT_E2E_DRIVER_EMAIL_CHROMIUM }}
          TEST_DRIVER_PASSWORD_CHROMIUM: ${{ secrets.ROUND_DIRECT_E2E_DRIVER_PASSWORD_CHROMIUM }}
          TEST_CONSUMER_EMAIL_MOBILE: ${{ secrets.ROUND_DIRECT_E2E_CONSUMER_EMAIL_MOBILE }}
          TEST_CONSUMER_PASSWORD_MOBILE: ${{ secrets.ROUND_DIRECT_E2E_CONSUMER_PASSWORD_MOBILE }}
          TEST_SELLER_EMAIL_MOBILE: ${{ secrets.ROUND_DIRECT_E2E_SELLER_EMAIL_MOBILE }}
          TEST_SELLER_PASSWORD_MOBILE: ${{ secrets.ROUND_DIRECT_E2E_SELLER_PASSWORD_MOBILE }}
          TEST_DRIVER_EMAIL_MOBILE: ${{ secrets.ROUND_DIRECT_E2E_DRIVER_EMAIL_MOBILE }}
          TEST_DRIVER_PASSWORD_MOBILE: ${{ secrets.ROUND_DIRECT_E2E_DRIVER_PASSWORD_MOBILE }}
        run: >-
          pnpm --filter e2e exec playwright test
          consumer-round-direct
          seller-sale-rounds
          driver-direct-delivery
          --project=chromium
          --project=mobile
          --workers=1
          --retries=0
          --reporter=list,json

      - name: 52건 무건너뜀 판정
        id: e2e_gate
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .stats.expected == 52 and
            .stats.skipped == 0 and
            .stats.unexpected == 0 and
            .stats.flaky == 0
          ' "$PLAYWRIGHT_JSON_OUTPUT_FILE" > /dev/null

      - name: chromium fixture cleanup
        id: cleanup_chromium
        if: ${{ always() }}
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.ROUND_DIRECT_E2E_FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          evidence_root=".artifacts/round-direct/$ROUND_DIRECT_E2E_RUN_ID"
          manifest="$evidence_root/chromium/manifest.json"
          mkdir -p "$evidence_root/evidence"
          if [[ ! -f "$manifest" ]]; then
            printf '{"action":"cleanup","project":"chromium","status":"not-seeded"}\n' \
              > "$evidence_root/evidence/cleanup-chromium.json"
            exit 0
          fi
          node scripts/round-direct-e2e-fixtures.mjs cleanup \
            --project=chromium \
            --manifest="$manifest" \
            > "$evidence_root/cleanup-chromium-raw.json"
          jq '{action, runId, project, ready, remainingDocumentCount: (.remainingDocuments | length), remainingObjectCount: (.remainingObjects | length)}' \
            "$evidence_root/cleanup-chromium-raw.json" \
            > "$evidence_root/evidence/cleanup-chromium.json"

      - name: mobile fixture cleanup
        id: cleanup_mobile
        if: ${{ always() }}
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.ROUND_DIRECT_E2E_FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          evidence_root=".artifacts/round-direct/$ROUND_DIRECT_E2E_RUN_ID"
          manifest="$evidence_root/mobile/manifest.json"
          mkdir -p "$evidence_root/evidence"
          if [[ ! -f "$manifest" ]]; then
            printf '{"action":"cleanup","project":"mobile","status":"not-seeded"}\n' \
              > "$evidence_root/evidence/cleanup-mobile.json"
            exit 0
          fi
          node scripts/round-direct-e2e-fixtures.mjs cleanup \
            --project=mobile \
            --manifest="$manifest" \
            > "$evidence_root/cleanup-mobile-raw.json"
          jq '{action, runId, project, ready, remainingDocumentCount: (.remainingDocuments | length), remainingObjectCount: (.remainingObjects | length)}' \
            "$evidence_root/cleanup-mobile-raw.json" \
            > "$evidence_root/evidence/cleanup-mobile.json"

      - name: 비민감 실행 요약 생성
        if: ${{ always() }}
        shell: bash
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          E2E_GATE_OUTCOME: ${{ steps.e2e_gate.outcome }}
          CLEANUP_CHROMIUM_OUTCOME: ${{ steps.cleanup_chromium.outcome }}
          CLEANUP_MOBILE_OUTCOME: ${{ steps.cleanup_mobile.outcome }}
        run: |
          set -euo pipefail
          evidence_root=".artifacts/round-direct/$ROUND_DIRECT_E2E_RUN_ID"
          mkdir -p "$evidence_root/evidence"
          if [[ -f "$PLAYWRIGHT_JSON_OUTPUT_FILE" ]]; then
            jq '{expected: .stats.expected, skipped: .stats.skipped, unexpected: .stats.unexpected, flaky: .stats.flaky, durationMs: .stats.duration}' \
              "$PLAYWRIGHT_JSON_OUTPUT_FILE" \
              > "$evidence_root/evidence/playwright-summary.json"
          else
            printf '{"status":"not-run"}\n' \
              > "$evidence_root/evidence/playwright-summary.json"
          fi
          jq -n \
            --arg expectedSha "$ROUND_DIRECT_E2E_EXPECTED_SHA" \
            --arg runId "$ROUND_DIRECT_E2E_RUN_ID" \
            --arg runAttempt "$ROUND_DIRECT_E2E_RUN_ATTEMPT" \
            --arg eventName "$ROUND_DIRECT_E2E_EVENT_NAME" \
            --arg actor "$ROUND_DIRECT_E2E_ACTOR" \
            --arg triggeringActor "$ROUND_DIRECT_E2E_TRIGGERING_ACTOR" \
            --arg workflowSha "$ROUND_DIRECT_E2E_WORKFLOW_SHA" \
            --arg e2eOutcome "$E2E_OUTCOME" \
            --arg e2eGateOutcome "$E2E_GATE_OUTCOME" \
            --arg chromiumCleanup "$CLEANUP_CHROMIUM_OUTCOME" \
            --arg mobileCleanup "$CLEANUP_MOBILE_OUTCOME" \
            '{
              runId: $runId,
              runAttempt: $runAttempt,
              eventName: $eventName,
              actor: $actor,
              triggeringActor: $triggeringActor,
              workflowSha: $workflowSha,
              expectedSha: $expectedSha,
              testResult: {e2e: $e2eOutcome, gate: $e2eGateOutcome},
              cleanupResult: {chromium: $chromiumCleanup, mobile: $mobileCleanup}
            }' \
            > "$evidence_root/evidence/workflow-summary.json"

      - name: 비민감 증거 artifact 업로드
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: round-direct-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/round-direct/${{ env.ROUND_DIRECT_E2E_RUN_ID }}/evidence/
          if-no-files-found: error
          retention-days: 7
