name: Sync preview branch

# main 에 코드/구성 변경이 푸시되면 preview 브랜치를 자동으로 최신화한다.
# docs-only 변경은 Preview 배포와 일반 E2E를 불필요하게 만들지 않도록 제외한다.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# 동시 실행 방지 — preview push 충돌 회피
concurrency:
  group: sync-preview
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # preview push(contents)에만 쓰기 권한을 둔다.
    # 저장소 스크립트를 실행하는 진단은 아래 읽기 전용 job으로 분리한다.
    permissions:
      contents: write
    outputs:
      preview_sha: ${{ steps.merge.outputs.preview_sha }}

    steps:
      # preview 브랜치로 push 하므로 checkout 자격 증명을 유지한다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: preview
          fetch-depth: 0

      - name: Merge main into preview
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge origin/main --no-edit -m "chore(preview): sync main into preview"
          git push origin preview
          printf 'preview_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # 일반 E2E(e2e.yml)는 더 이상 자동으로 디스패치하지 않는다. 회차 직배송 판매 모드에서는
      # 쓰지 않는 legacy 흐름이고, 설정 출처 문제(BACKLOG LEGACY-E2E-WORKFLOW-VARS)로 최근 100회
      # 성공이 없어 실패 알림만 반복했다. 필요하면 Actions에서 수동(workflow_dispatch)으로 실행한다.
      # 출시 검증은 e2e-round-direct.yml이 소유한다.

  # 이 자동 동기화 경로에는 workflow_dispatch로 고정한 deployment ID가 없다.
  # 따라서 GitHub commit status는 진단 정보로만 남기고 canonical acceptance에는
  # 사용하지 않는다. pinned metadata 검증은 round-direct workflow가 소유한다.
  preview-status-diagnostic:
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: read

    steps:
      # 동기화 job이 push 한 preview HEAD 를 그대로 진단한다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sync.outputs.preview_sha }}
          persist-credentials: false

      # wait-preview-deploy.mjs 는 액션이 아니라 러너 기본 Node 로 직접 실행되므로
      # 러너 OS 변동에 좌우되지 않도록 Node 버전을 명시 고정한다(e2e.yml 과 동일 22).
      # npm 의존성 없음(child_process + gh CLI 빌트인만) → cache/install 불필요.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Preview commit status diagnostic (non-blocking)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: node scripts/wait-preview-deploy.mjs --diagnostic-status
