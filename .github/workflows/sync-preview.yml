name: Sync preview branch

# main 에 코드/구성 변경이 푸시되면 preview 브랜치를 자동으로 최신화한다.
# docs-only 변경은 Preview 배포와 일반 E2E를 불필요하게 만들지 않도록 제외한다.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# 동시 실행 방지 — preview push 충돌 회피
concurrency:
  group: sync-preview
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      deployments: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: preview
          fetch-depth: 0

      # wait-preview-deploy.mjs 는 액션이 아니라 러너 기본 Node 로 직접 실행되므로
      # 러너 OS 변동에 좌우되지 않도록 Node 버전을 명시 고정한다(e2e.yml 과 동일 22).
      # npm 의존성 없음(child_process + gh CLI 빌트인만) → cache/install 불필요.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Merge main into preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge origin/main --no-edit -m "chore(preview): sync main into preview"
          git push origin preview

      # sync-preview success ≠ Vercel 실배포 완료. 여기서 막지 않으면 아래 e2e
      # dispatch 가 stale(이전 커밋) preview 를 검사한다(세션39·60·61 race).
      # 3앱 Preview deployment 가 현재 preview HEAD 로 success 할 때까지 폴링하고,
      # timeout 시 fail-fast(exit 1)로 e2e dispatch 를 차단해 배포 지연을 노출한다.
      - name: Wait for preview deploy (SHA-matched deployments poll)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/wait-preview-deploy.mjs

      # GITHUB_TOKEN 으로 만든 push 는 다른 워크플로(e2e.yml 의 push 트리거)를
      # 재귀 방지 정책상 발화시키지 않는다. workflow_dispatch 는 발화하므로
      # 동기화 직후 e2e 를 명시적으로 디스패치한다.
      - name: Trigger E2E workflow on preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run e2e.yml --ref preview
