name: Deployment safety guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify deployment safety invariants
        run: node scripts/verify-deployment-safety.mjs
      - name: Verify Git publication safety
        run: node --test scripts/git/publication-admission.spec.mjs scripts/git/publication-transport.spec.mjs scripts/git/publication-rebind.spec.mjs
      - name: Verify stateless run-once executor safety
        run: node --test scripts/agent/run-once.spec.mjs
      - name: Verify visible OpenCode TUI launcher safety
        run: node --test scripts/agent/open-visible-tui.spec.mjs
      - name: Verify stateless run-publish-once publication safety
        run: node --test scripts/agent/run-publish-once.spec.mjs
      - name: Verify deterministic run-goal core safety
        run: node --test scripts/agent/run-goal.spec.mjs
      - name: Verify natural-language BUILD front door safety
        run: node --test scripts/agent/run-build.spec.mjs
      - name: Verify bounded foreground Night Run safety
        run: node --test scripts/agent/run-night.spec.mjs
