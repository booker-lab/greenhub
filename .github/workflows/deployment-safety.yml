name: Deployment safety guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify deployment safety invariants
        run: node scripts/verify-deployment-safety.mjs
      - name: Verify Git publication safety
        run: node --test scripts/git/publication-admission.spec.mjs scripts/git/publication-transport.spec.mjs
