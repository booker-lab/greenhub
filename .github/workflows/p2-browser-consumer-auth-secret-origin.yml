name: P2 Browser Consumer Auth Secret Origin Discrimination

on:
  push:
    branches:
      - codex/p2-browser-consumer-auth-probe
    paths:
      - .github/workflows/p2-browser-consumer-auth-secret-origin.yml
      - scripts/discriminate-consumer-auth-secret-origin.mjs
      - scripts/discriminate-consumer-auth-secret-origin.spec.mjs

concurrency:
  group: p2-browser-consumer-auth-secret-origin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discriminate:
    name: Consumer 인증 secret origin read-only discrimination
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: round-direct-e2e
    permissions:
      contents: read
    env:
      EXPECTED_SHA: 9fda1a0909644cb77a223941f28266f7af69cdf9
      ROUND_DIRECT_E2E_VERCEL_READ_TOKEN: ${{ secrets.ROUND_DIRECT_E2E_VERCEL_READ_TOKEN }}
      ROUND_DIRECT_E2E_TEST_SECRET: ${{ secrets.ROUND_DIRECT_E2E_TEST_SECRET }}
      RESULT_FILE: .artifacts/p2-browser-consumer-auth-secret-origin/result.json
    steps:
      - name: 진단 브랜치 checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Node.js 준비
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Vercel CLI 준비
        run: npm install --global vercel@53.2.0

      - name: read-only collector 정적 안전 확인
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eni '(playwright|workflow_dispatch|setDoc|updateDoc|deleteDoc|runTransaction|curl|POST|PATCH|DELETE|/auth/login|/auth/refresh|/auth/kakao-login|/api/auth/csrf|/api/auth/callback)' \
            scripts/discriminate-consumer-auth-secret-origin.mjs; then
            echo 'SECRET_ORIGIN_COLLECTOR_UNSAFE_OPERATION_MARKER' >&2
            exit 1
          fi

      - name: 집중 collector 단위 테스트
        run: node --test scripts/discriminate-consumer-auth-secret-origin.spec.mjs

      - name: exact deployment secret origin read-only collector 실행
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RESULT_FILE")"
          set +e
          node scripts/discriminate-consumer-auth-secret-origin.mjs > "$RESULT_FILE"
          collector_status=$?
          set -e
          if [[ ! -s "$RESULT_FILE" ]]; then
            echo 'secret origin discrimination 결과가 없어 실행을 실패 처리합니다.' >&2
            exit 1
          fi
          exit "$collector_status"

      - name: 비민감 결과 구조와 단계 행렬 검증
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s "$RESULT_FILE" ]]; then
            echo '결과 구조 검증 대상 파일이 없습니다.' >&2
            exit 1
          fi
          node --input-type=module - "$RESULT_FILE" <<'NODE'
          import { readFileSync } from 'node:fs';

          const result = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const requiredKeys = ['status', 'authorities', 'endpointMatrix', 'mutationCheck'];
          for (const key of requiredKeys) {
            if (!(key in result)) throw new Error(`결과 필드가 없습니다: ${key}`);
          }
          const requiredStages = [
            'DEPLOYMENT_METADATA',
            'PROJECT_METADATA',
            'ENV_V10_METADATA_ONLY',
            'ENV_V9_METADATA_ONLY',
            'ENV_V10_DECRYPTED_CLI_SOURCE',
            'SELECTED_SECRET_PROJECT_ENV',
            'SELECTED_API_ORIGIN_PROJECT_ENV',
            'SHARED_SECRET_ENV',
            'SHARED_API_ORIGIN_ENV',
            'VERCEL_ENV_RUN',
            'DEPLOYMENT_FILES',
            'DEPLOYMENT_FILE_CONTENT',
          ];
          const matrix = result.endpointMatrix;
          for (const stage of requiredStages) {
            if (!Object.values(matrix).some((entry) => entry?.stage === stage)) {
              throw new Error(`endpoint stage가 없습니다: ${stage}`);
            }
          }
          if (Object.values(result.mutationCheck).some((value) => value !== false)) {
            throw new Error('읽기 전용 mutation 불변식이 깨졌습니다.');
          }
          const serialized = JSON.stringify(result);
          const injectedSecret = process.env.ROUND_DIRECT_E2E_TEST_SECRET;
          if (injectedSecret && serialized.includes(injectedSecret)) {
            throw new Error('민감한 secret 값이 결과에 포함되었습니다.');
          }
          if (serialized.includes('Authorization: Bearer')) {
            throw new Error('Authorization header가 결과에 포함되었습니다.');
          }
          NODE

      - name: 비민감 discrimination 결과 artifact 업로드
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: p2-browser-consumer-auth-secret-origin-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/p2-browser-consumer-auth-secret-origin/
          if-no-files-found: error
          retention-days: 7
