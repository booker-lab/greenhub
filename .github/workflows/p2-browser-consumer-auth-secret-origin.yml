name: P2 Browser Consumer Auth Secret Origin Discrimination

on:
  push:
    branches:
      - codex/p2-browser-consumer-auth-probe
    paths:
      - .github/workflows/p2-browser-consumer-auth-secret-origin.yml
      - scripts/discriminate-consumer-auth-secret-origin.mjs
      - scripts/discriminate-consumer-auth-secret-origin.spec.mjs

concurrency:
  group: p2-browser-consumer-auth-secret-origin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discriminate:
    name: Consumer 인증 secret origin read-only discrimination
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: round-direct-e2e
    permissions:
      contents: read
    env:
      EXPECTED_SHA: 9fda1a0909644cb77a223941f28266f7af69cdf9
      ROUND_DIRECT_E2E_VERCEL_READ_TOKEN: ${{ secrets.ROUND_DIRECT_E2E_VERCEL_READ_TOKEN }}
      ROUND_DIRECT_E2E_TEST_SECRET: ${{ secrets.ROUND_DIRECT_E2E_TEST_SECRET }}
      RESULT_FILE: .artifacts/p2-browser-consumer-auth-secret-origin/result.json
    steps:
      - name: 진단 브랜치 checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Node.js 준비
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: read-only collector 정적 안전 확인
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eni '(playwright|workflow_dispatch|setDoc|updateDoc|deleteDoc|runTransaction|curl|POST|PATCH|DELETE|/auth/login|/auth/refresh|/auth/kakao-login|/api/auth/csrf|/api/auth/callback)' \
            scripts/discriminate-consumer-auth-secret-origin.mjs; then
            echo 'SECRET_ORIGIN_COLLECTOR_UNSAFE_OPERATION_MARKER' >&2
            exit 1
          fi

      - name: 집중 collector 단위 테스트
        run: node --test scripts/discriminate-consumer-auth-secret-origin.spec.mjs

      - name: exact deployment secret origin read-only collector 실행
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RESULT_FILE")"
          set +e
          node scripts/discriminate-consumer-auth-secret-origin.mjs > "$RESULT_FILE"
          collector_status=$?
          set -e
          if [[ ! -s "$RESULT_FILE" ]]; then
            echo 'secret origin discrimination 결과가 없어 실행을 실패 처리합니다.' >&2
            exit 1
          fi
          exit "$collector_status"

      - name: 비민감 discrimination 결과 artifact 업로드
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: p2-browser-consumer-auth-secret-origin-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/p2-browser-consumer-auth-secret-origin/
          if-no-files-found: error
          retention-days: 7
