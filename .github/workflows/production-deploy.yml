name: Production deploy

# 운영 배포. 사용자가 채팅에서 "<SHA> 운영 배포해"라고 명시적으로 승인한 뒤에만 실행한다(AGENTS.md 승인 경계).
# 이 파일은 승인을 dispatch 입력(approval)·실행자=저장소 owner·실행 ref=main 확인으로 강제한다
# (e2e-round-direct.yml과 같은 방식). 저장소가 공개라 production Environment에 required reviewer를 둘 수 있지만,
# 그 설정은 GitHub 저장소 설정이라 이 파일이 대신하지 않는다.
#
# 순서(docs/memory.md 운영 배포 순서와 같다):
#   같은 SHA 원격 회차 E2E 통과 확인 → Firestore 인덱스(READY까지 대기) → API(Railway 또는 Cloud Run, /health commit 확인)
#   → 프런트 3개(Vercel production, 변경 없는 앱은 빌드 생략) → Firestore·Storage 규칙 → post-deploy-smoke
# scope로 일부만 다시 실행할 수 있다(예: API만 늦었을 때 api).
#
# 1회 준비(저장소 Settings → Environments → production → Environment secrets):
#   RAILWAY_TOKEN                         Railway 프로젝트 Settings → Tokens에서 production 환경용 project token
#   RAILWAY_API_SERVICE_ID                Railway API 서비스 ID(서비스 화면 주소 .../service/<ID>)
#   VERCEL_PRODUCTION_TOKEN               Vercel Account Settings → Tokens, 팀 범위 token
#   FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON  green-e4fe3 서비스 계정 키(역할: Firebase Admin, Service Usage Consumer)
# 비밀값은 production Environment에만 두어 이 workflow의 deploy job만 읽는다. 값은 출력하지 않는다.
#
# Cloud Run(api_platform=cloudrun)은 키 파일 없이 Workload Identity Federation으로 인증한다. production Environment
# 변수(비밀값 아님, docs/specs/ops/api-cloud-run-runbook.md R5에서 만든 값):
#   GCP_WORKLOAD_IDENTITY_PROVIDER        projects/<번호>/locations/global/workloadIdentityPools/<풀>/providers/<공급자>
#   GCP_DEPLOY_SERVICE_ACCOUNT            배포 전용 서비스 계정 이메일

on:
  workflow_dispatch:
    inputs:
      sha:
        description: '운영에 내보낼 40자리 commit SHA(원격 회차 E2E를 통과한 것)'
        required: true
        type: string
      e2e_run_id:
        description: '같은 SHA로 통과한 Round direct E2E run ID'
        required: true
        type: string
      scope:
        description: '배포 범위'
        required: true
        type: choice
        default: all
        options:
          - all
          - indexes
          - api
          - frontends
          - rules
      api_platform:
        description: 'API 배포 대상(전환 전에는 railway, Cloud Run 시험·전환 때 cloudrun)'
        required: true
        type: choice
        default: railway
        options:
          - railway
          - cloudrun
      approval:
        description: '사용자가 채팅에서 이 SHA의 운영 배포를 승인했습니다.'
        required: true
        type: choice
        options:
          - PRODUCTION_DEPLOY_APPROVED

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  gate:
    name: 승인·SHA·E2E 확인
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: dispatch·실행자·ref·승인·SHA 형식 확인
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref }}
          APPROVAL: ${{ inputs.approval }}
          SHA: ${{ inputs.sha }}
          SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          printf 'sha=%s scope=%s actor=%s ref=%s\n' "$SHA" "$SCOPE" "$ACTOR" "$REF"
          if [[ "$EVENT_NAME" != 'workflow_dispatch' ]]; then
            echo 'workflow_dispatch로만 운영 배포를 실행합니다.' >&2; exit 1
          fi
          if [[ "$ACTOR" != "$REPOSITORY_OWNER" || "$TRIGGERING_ACTOR" != "$REPOSITORY_OWNER" ]]; then
            echo '실행자가 저장소 owner가 아니어서 차단합니다.' >&2; exit 1
          fi
          # 다른 브랜치에서 실행하면 그 브랜치의 workflow·배포 도구가 쓰인다. main에서만 받는다.
          if [[ "$REF" != 'refs/heads/main' ]]; then
            echo 'main에서만 운영 배포를 실행합니다.' >&2; exit 1
          fi
          if [[ "$APPROVAL" != 'PRODUCTION_DEPLOY_APPROVED' ]]; then
            echo '운영 배포 승인이 없어 차단합니다.' >&2; exit 1
          fi
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'SHA는 40자리 소문자 16진수여야 합니다.' >&2; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: SHA가 main 이력에 있는지 확인
        shell: bash
        env:
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "${SHA}^{commit}"
          git merge-base --is-ancestor "$SHA" origin/main

      - name: 같은 SHA 원격 회차 E2E 통과 확인
        shell: bash
        env:
          SHA: ${{ inputs.sha }}
          E2E_RUN_ID: ${{ inputs.e2e_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release/production-deploy.mjs verify-e2e --sha="$SHA" --run-id="$E2E_RUN_ID" | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    name: 운영 배포
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: production
    permissions:
      contents: read
      # Cloud Run 배포의 Workload Identity Federation 인증(GitHub OIDC 토큰)에만 쓴다.
      id-token: write
    # 단계별 배포 결과(production-deploy.mjs JSON, 비밀값 없음)를 record job에 넘긴다.
    outputs:
      results: ${{ steps.collect.outputs.results }}
    env:
      SHA: ${{ inputs.sha }}
      SCOPE: ${{ inputs.scope }}
      API_PLATFORM: ${{ inputs.api_platform }}
      FIREBASE_PROJECT: green-e4fe3
      # scripts/release/api-hosts.mjs의 CLOUD_RUN_PRODUCTION과 같아야 한다.
      CLOUD_RUN_IMAGE_REPOSITORY: asia-northeast3-docker.pkg.dev/green-e4fe3/greenhub/api
      CLOUD_RUN_API_BASE: https://greenhub-api-988412563635.asia-northeast3.run.app
    # 비밀값은 job env에 두지 않고 그 값을 쓰는 step의 env에만 둔다. Firebase 서비스 계정 키 파일은 Firebase를 쓰는
    # step 안에서만 만들고 그 step이 끝날 때 지운다(GITHUB_ENV로 다음 step에 넘기지 않는다).
    steps:
      # 배포 스크립트는 실행 ref와 상관없이 main에서 가져온다(gate도 main 실행만 통과시킨다).
      - name: 배포 도구 checkout(main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: 배포 대상 SHA checkout(규칙·인덱스 원본)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          path: target
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # 운영 비밀값을 쓰는 job이라 의존성 캐시를 쓰지 않는다.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: 범위별 비밀값 확인(배포 전에 멈춤)
        shell: bash
        # 값은 넘기지 않고 설정 여부(true/false)만 넘긴다.
        env:
          HAS_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN != '' }}
          HAS_RAILWAY_API_SERVICE_ID: ${{ secrets.RAILWAY_API_SERVICE_ID != '' }}
          HAS_VERCEL_PRODUCTION_TOKEN: ${{ secrets.VERCEL_PRODUCTION_TOKEN != '' }}
          HAS_FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON != '' }}
          HAS_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
          HAS_GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT != '' }}
        run: |
          set -euo pipefail
          missing=()
          need() { local flag="HAS_$1"; [[ "${!flag:-false}" == 'true' ]] || missing+=("$1"); }
          need_api() {
            case "$API_PLATFORM" in
              railway) need RAILWAY_TOKEN; need RAILWAY_API_SERVICE_ID ;;
              cloudrun) need GCP_WORKLOAD_IDENTITY_PROVIDER; need GCP_DEPLOY_SERVICE_ACCOUNT ;;
              *) echo "알 수 없는 api_platform: $API_PLATFORM" >&2; exit 1 ;;
            esac
          }
          case "$SCOPE" in
            all) need_api; need VERCEL_PRODUCTION_TOKEN; need FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON ;;
            indexes|rules) need FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON ;;
            api) need_api ;;
            frontends) need VERCEL_PRODUCTION_TOKEN ;;
            *) echo "알 수 없는 scope: $SCOPE" >&2; exit 1 ;;
          esac
          if (( ${#missing[@]} )); then
            printf 'production Environment 비밀값이 없습니다: %s\n' "${missing[*]}" >&2; exit 1
          fi
          {
            echo "## 운영 배포 \`$SHA\` (scope: $SCOPE, API: $API_PLATFORM)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # firebase-tools는 npx로 받지 않고 lockfile에 고정된 scripts devDependency만 설치한다.
      # 이 step에는 비밀값이 없다. pnpm은 허용 목록(onlyBuiltDependencies) 밖 패키지의 설치 스크립트를 실행하지 않는다.
      - name: Firebase CLI 설치(lockfile 고정)
        if: inputs.scope == 'all' || inputs.scope == 'indexes' || inputs.scope == 'rules'
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --filter ./scripts --dev
          scripts/node_modules/.bin/firebase --version

      # 인덱스를 배포하고 모두 READY가 될 때까지 기다린다. 키 파일과 gcloud 설정 폴더는 이 step 안에서만 쓰고,
      # 끝나면(실패·취소 포함) 지운다. 키 내용은 firebase·gcloud 프로세스 env에 넘기지 않는다.
      - name: Firestore 인덱스 배포·READY 대기
        if: inputs.scope == 'all' || inputs.scope == 'indexes'
        shell: bash
        working-directory: target
        env:
          FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/firebase-indexes.json"
          export CLOUDSDK_CONFIG="$RUNNER_TEMP/gcloud-indexes"
          export CLOUDSDK_CORE_DISABLE_PROMPTS=1
          trap 'rm -rf "$key" "$CLOUDSDK_CONFIG"' EXIT
          trap 'exit 1' INT TERM
          (umask 077 && printf '%s' "$FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON" > "$key")
          unset FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON
          project="$(jq -r .project_id "$key")"
          if [[ "$project" != "$FIREBASE_PROJECT" ]]; then
            echo "서비스 계정 프로젝트($project)가 운영($FIREBASE_PROJECT)이 아닙니다." >&2; exit 1
          fi
          GOOGLE_APPLICATION_CREDENTIALS="$key" "$GITHUB_WORKSPACE/scripts/node_modules/.bin/firebase" \
            deploy --only firestore:indexes --project "$FIREBASE_PROJECT" --non-interactive
          gcloud auth activate-service-account --key-file="$key" --quiet
          deadline=$(( $(date +%s) + 45 * 60 ))
          while :; do
            pending="$(gcloud firestore indexes composite list --project="$FIREBASE_PROJECT" --format=json \
              | jq -r '[.[] | select(.state != "READY") | .name] | join(" ")')"
            if [[ -z "$pending" ]]; then
              echo "- Firestore 인덱스: 모두 READY" >> "$GITHUB_STEP_SUMMARY"
              printf 'indexes\t{"status":"READY"}\n' >> "$RUNNER_TEMP/deploy-results.tsv"
              break
            fi
            if (( $(date +%s) > deadline )); then
              echo "인덱스가 제한 시간 안에 READY가 되지 않았습니다: $pending" >&2; exit 1
            fi
            echo "READY 대기: $pending"
            sleep 30
          done

      - name: API 배포(Railway)
        if: (inputs.scope == 'all' || inputs.scope == 'api') && inputs.api_platform == 'railway'
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_SERVICE_ID: ${{ secrets.RAILWAY_API_SERVICE_ID }}
        run: |
          set -euo pipefail
          result="$(node scripts/release/production-deploy.mjs railway --sha="$SHA")"
          echo "$result"
          echo "- API(Railway): \`$result\`" >> "$GITHUB_STEP_SUMMARY"
          printf 'railway\t%s\n' "$result" >> "$RUNNER_TEMP/deploy-results.tsv"

      # 인덱스 단계(자기 gcloud 설정 폴더 사용)가 끝난 뒤에 인증해 그 단계에 영향을 주지 않는다.
      # 키 파일 없이 GitHub OIDC 토큰을 배포 전용 서비스 계정의 짧은 토큰으로 바꾼다.
      # api_platform=railway여도 WIF 변수가 있으면 Cloud Run 예비 서버(트래픽·정기 작업 없음)에 같은 SHA를
      # 배포한다(2026-10-23 사용자 결정, docs/specs/ops/railway-outage-failover.md). 이때 아래 세 단계의 실패는
      # 운영 배포를 막지 않는다(continue-on-error). Railway 배포·확인이 먼저 끝난 뒤에 실행된다.
      - name: Google Cloud 인증(Workload Identity Federation)
        continue-on-error: ${{ inputs.api_platform == 'railway' }}
        if: (inputs.scope == 'all' || inputs.scope == 'api') && (inputs.api_platform == 'cloudrun' || vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '')
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      # 배포 대상 SHA의 Dockerfile·소스로 이미지를 만든다. 같은 SHA 태그가 이미 있으면 다시 만들지 않는다.
      - name: API 이미지 빌드·푸시(Artifact Registry)
        continue-on-error: ${{ inputs.api_platform == 'railway' }}
        if: (inputs.scope == 'all' || inputs.scope == 'api') && (inputs.api_platform == 'cloudrun' || vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '')
        shell: bash
        run: |
          set -euo pipefail
          image="$CLOUD_RUN_IMAGE_REPOSITORY:$SHA"
          gcloud auth configure-docker asia-northeast3-docker.pkg.dev --quiet
          if gcloud artifacts docker images describe "$image" --format='value(image_summary.digest)' >/dev/null 2>&1; then
            echo "- API 이미지: 이미 있음 \`$image\`" >> "$GITHUB_STEP_SUMMARY"
          else
            docker build --pull -t "$image" target
            docker push "$image"
            echo "- API 이미지: 빌드·푸시 \`$image\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: API 배포(Cloud Run)
        continue-on-error: ${{ inputs.api_platform == 'railway' }}
        if: (inputs.scope == 'all' || inputs.scope == 'api') && (inputs.api_platform == 'cloudrun' || vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '')
        shell: bash
        run: |
          set -euo pipefail
          result="$(node scripts/release/production-deploy.mjs cloudrun --sha="$SHA" --api-base="$CLOUD_RUN_API_BASE")"
          echo "$result"
          label='API(Cloud Run)'
          step='cloudrun'
          if [[ "$API_PLATFORM" == 'railway' ]]; then label='Cloud Run 예비 서버'; step='cloudrun-standby'; fi
          echo "- $label: \`$result\`" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\t%s\n' "$step" "$result" >> "$RUNNER_TEMP/deploy-results.tsv"

      - name: API /health commit 확인
        if: inputs.scope == 'all' || inputs.scope == 'api'
        shell: bash
        run: |
          set -euo pipefail
          api_base=()
          if [[ "$API_PLATFORM" == 'cloudrun' ]]; then api_base=(--api-base="$CLOUD_RUN_API_BASE"); fi
          result="$(node scripts/release/production-deploy.mjs health --sha="$SHA" "${api_base[@]}")"
          echo "$result"
          echo "- API /health: \`$result\`" >> "$GITHUB_STEP_SUMMARY"
          printf 'health\t%s\n' "$result" >> "$RUNNER_TEMP/deploy-results.tsv"

      - name: 프런트 3개 배포(Vercel production)
        if: inputs.scope == 'all' || inputs.scope == 'frontends'
        shell: bash
        env:
          VERCEL_PRODUCTION_TOKEN: ${{ secrets.VERCEL_PRODUCTION_TOKEN }}
        run: |
          set -euo pipefail
          # Vercel Hobby는 동시 빌드 1개라 consumer부터 차례로 배포한다(consumer가 규칙보다 먼저 나가야 한다).
          for app in consumer seller driver; do
            result="$(node scripts/release/production-deploy.mjs vercel --sha="$SHA" --app="$app")"
            echo "$result"
            echo "- $app(Vercel): \`$result\`" >> "$GITHUB_STEP_SUMMARY"
            printf 'vercel\t%s\n' "$result" >> "$RUNNER_TEMP/deploy-results.tsv"
          done

      # 키 파일은 이 step 안에서만 쓰고, 끝나면(실패·취소 포함) 지운다.
      - name: Firestore·Storage 규칙 배포
        if: inputs.scope == 'all' || inputs.scope == 'rules'
        shell: bash
        working-directory: target
        env:
          FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/firebase-rules.json"
          trap 'rm -f "$key"' EXIT
          trap 'exit 1' INT TERM
          (umask 077 && printf '%s' "$FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON" > "$key")
          unset FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON
          project="$(jq -r .project_id "$key")"
          if [[ "$project" != "$FIREBASE_PROJECT" ]]; then
            echo "서비스 계정 프로젝트($project)가 운영($FIREBASE_PROJECT)이 아닙니다." >&2; exit 1
          fi
          GOOGLE_APPLICATION_CREDENTIALS="$key" "$GITHUB_WORKSPACE/scripts/node_modules/.bin/firebase" \
            deploy --only firestore:rules,storage --project "$FIREBASE_PROJECT" --non-interactive
          echo "- Firestore·Storage 규칙: 배포됨" >> "$GITHUB_STEP_SUMMARY"
          printf 'rules\t{"status":"deployed"}\n' >> "$RUNNER_TEMP/deploy-results.tsv"

      - name: 배포 뒤 확인(post-deploy-smoke)
        if: always() && !cancelled()
        shell: bash
        run: |
          set -uo pipefail
          expect=()
          if [[ "$SCOPE" == 'all' || "$SCOPE" == 'api' ]]; then expect=(--expect-sha="$SHA"); fi
          # Cloud Run 배포면 그 API를 확인한다(전환 전에는 프런트가 아직 Railway를 본다).
          if [[ "$API_PLATFORM" == 'cloudrun' ]]; then expect+=(--api="$CLOUD_RUN_API_BASE"); fi
          status=0
          node scripts/release/post-deploy-smoke.mjs "${expect[@]}" > /tmp/smoke.txt 2>&1 || status=$?
          cat /tmp/smoke.txt
          {
            echo ""
            echo "### post-deploy-smoke"
            echo '```'
            cat /tmp/smoke.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # 앞 단계가 모두 성공했을 때만 결과를 넘긴다(실패한 배포는 기록하지 않는다).
      - name: 배포 결과 모으기
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'results<<GREENHUB_DEPLOY_RESULTS'
            cat "$RUNNER_TEMP/deploy-results.tsv" 2>/dev/null || true
            echo 'GREENHUB_DEPLOY_RESULTS'
          } >> "$GITHUB_OUTPUT"

      # 각 step이 끝날 때 지우지만, 취소 등으로 남았을 수 있는 키·gcloud 설정을 한 번 더 지운다.
      - name: 서비스 계정 키 삭제
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/firebase-indexes.json" "$RUNNER_TEMP/firebase-rules.json" "$RUNNER_TEMP/gcloud-indexes"

  # 운영 배포 기록을 GitHub Release로 남긴다(docs/memory.md 배포 기록 PR을 대신한다).
  # production Environment를 쓰지 않아 운영 비밀값이 없다. Release·tag 만들기에만 쓰기 권한을 둔다.
  # 기록 실패는 배포 결과를 바꾸지 않으므로 run을 실패로 만들지 않고 경고만 남긴다.
  record:
    name: 배포 기록(GitHub Release)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Release 만들기
        shell: bash
        env:
          SHA: ${{ inputs.sha }}
          SCOPE: ${{ inputs.scope }}
          API_PLATFORM: ${{ inputs.api_platform }}
          E2E_RUN_ID: ${{ inputs.e2e_run_id }}
          RUN_ID: ${{ github.run_id }}
          RESULTS: ${{ needs.deploy.outputs.results }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          printf '%s\n' "$RESULTS" > "$RUNNER_TEMP/deploy-results.tsv"
          if out="$(node scripts/release/release-record.mjs --sha="$SHA" --scope="$SCOPE" \
            --api-platform="$API_PLATFORM" --e2e-run-id="$E2E_RUN_ID" --run-id="$RUN_ID" \
            --results="$RUNNER_TEMP/deploy-results.tsv")"; then
            echo "$out"
            echo "- 배포 기록: \`$out\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::warning::운영 배포는 끝났지만 Release 기록을 만들지 못했습니다. 이 run 요약의 배포 결과로 기록을 남기세요.'
          fi
