name: E2E Tests

on:
  push:
    branches: [preview]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      # version 미지정 — package.json 의 packageManager(pnpm@10.x) 를 따른다
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      # 시드 의존 spec(주문 카드·parcel·orderNumber) 1차 통과 보장 — 세션61·67·69 3회 재발 종결(#CL-42).
      # seed 실패 시 process.exit(1)로 step fail → 후속 test 미실행(silent pass 방지).
      - name: Seed E2E fixtures (Firestore)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/seed-e2e-orders.mjs

      - name: Run E2E tests (Preview)
        env:
          SELLER_BASE: ${{ secrets.SELLER_BASE }}
          CONSUMER_BASE: ${{ secrets.CONSUMER_BASE }}
          DRIVER_BASE: ${{ secrets.DRIVER_BASE }}
          SELLER_BYPASS_SECRET: ${{ secrets.SELLER_BYPASS_SECRET }}
          CONSUMER_BYPASS_SECRET: ${{ secrets.CONSUMER_BYPASS_SECRET }}
          DRIVER_BYPASS_SECRET: ${{ secrets.DRIVER_BYPASS_SECRET }}
          E2E_TEST_SECRET: ${{ secrets.E2E_TEST_SECRET }}
          TEST_SELLER_EMAIL: ${{ secrets.TEST_SELLER_EMAIL }}
          TEST_SELLER_PASSWORD: ${{ secrets.TEST_SELLER_PASSWORD }}
          TEST_CONSUMER_EMAIL: ${{ secrets.TEST_CONSUMER_EMAIL }}
          TEST_CONSUMER_PASSWORD: ${{ secrets.TEST_CONSUMER_PASSWORD }}
          # cleanup-spec-residue.mjs — seller-auth-invite afterAll 잔여물 정리용 firebase-admin 인증
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: pnpm --filter e2e exec playwright test --project=chromium

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
