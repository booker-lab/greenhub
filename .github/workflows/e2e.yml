name: E2E Tests

on:
  push:
    branches: [preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-e2e
  cancel-in-progress: false

jobs:
  dispatch_gate:
    name: 실행 ref·실행자 사전 검증
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: 실행 ref·실행자 사전 검증
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf 'run_id=%s\n' "$RUN_ID"
          printf 'run_attempt=%s\n' "$RUN_ATTEMPT"
          printf 'event_name=%s\n' "$EVENT_NAME"
          printf 'ref=%s\n' "$REF"
          printf 'actor=%s\n' "$ACTOR"
          printf 'triggering_actor=%s\n' "$TRIGGERING_ACTOR"
          printf 'repository_owner=%s\n' "$REPOSITORY_OWNER"
          printf 'workflow_sha=%s\n' "$WORKFLOW_SHA"
          if [[ "$EVENT_NAME" != 'workflow_dispatch' && "$EVENT_NAME" != 'push' ]]; then
            echo 'workflow_dispatch·push 이외의 이벤트에서는 일반 E2E를 실행할 수 없습니다.' >&2
            exit 1
          fi
          if [[ "$REF" != 'refs/heads/preview' && "$REF" != 'refs/heads/main' ]]; then
            echo 'preview·main 이외의 ref에서는 일반 E2E를 실행할 수 없습니다.' >&2
            exit 1
          fi
          if [[ "$ACTOR" != "$REPOSITORY_OWNER" ]]; then
            echo 'workflow 실행자가 repository owner와 달라 실행을 차단합니다.' >&2
            exit 1
          fi
          if [[ "$TRIGGERING_ACTOR" != "$REPOSITORY_OWNER" ]]; then
            echo 'workflow triggering actor가 repository owner와 달라 실행을 차단합니다.' >&2
            exit 1
          fi

  e2e:
    needs: dispatch_gate
    # 사전 검증 job과 같은 조건을 job 수준에서도 걸어, 조건 밖에서는 secret을 읽는 job을 시작하지 않는다.
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
      && (github.ref == 'refs/heads/preview' || github.ref == 'refs/heads/main')
      && github.actor == github.repository_owner
      && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PREVIEW_E2E_HARNESS_ENABLED: 'true'
      ROUND_DIRECT_E2E_ENABLED: 'false'
      ROUND_DIRECT_E2E_ENV: preview
      ROUND_DIRECT_E2E_RUN_ID: generic-${{ github.run_id }}-${{ github.run_attempt }}
      ROUND_DIRECT_E2E_PROVIDER_MODE: stub
      ROUND_DIRECT_E2E_FIXTURE_PROJECTS: generic
      ROUND_DIRECT_E2E_CLEANUP_CONFIGURED: 'true'
      ROUND_DIRECT_E2E_API_ORIGIN: ${{ vars.ROUND_DIRECT_E2E_API_ORIGIN }}
      ROUND_DIRECT_E2E_ALLOWED_API_ORIGINS: ${{ vars.ROUND_DIRECT_E2E_ALLOWED_API_ORIGINS }}
      ROUND_DIRECT_E2E_ALLOWED_PREVIEW_APP_ORIGINS: ${{ vars.ROUND_DIRECT_E2E_ALLOWED_PREVIEW_APP_ORIGINS }}
      FIREBASE_PROJECT_ID: ${{ vars.ROUND_DIRECT_E2E_FIREBASE_PROJECT_ID }}
      ROUND_DIRECT_E2E_ALLOWED_FIREBASE_PROJECTS: ${{ vars.ROUND_DIRECT_E2E_ALLOWED_FIREBASE_PROJECTS }}
      FIREBASE_STORAGE_BUCKET: ${{ vars.ROUND_DIRECT_E2E_STORAGE_BUCKET }}
      ROUND_DIRECT_E2E_ALLOWED_STORAGE_BUCKETS: ${{ vars.ROUND_DIRECT_E2E_ALLOWED_STORAGE_BUCKETS }}
      ROUND_DIRECT_E2E_STORAGE_PREFIX: e2e/round-direct/generic-${{ github.run_id }}-${{ github.run_attempt }}/
      ROUND_DIRECT_E2E_STORE_ID: preview-e2e-generic-${{ github.run_id }}-${{ github.run_attempt }}-generic-store
      ROUND_DIRECT_E2E_FIXTURE_MANIFEST: .artifacts/round-direct/generic-${{ github.run_id }}-${{ github.run_attempt }}/generic/manifest.json
      API_BASE: ${{ vars.ROUND_DIRECT_E2E_API_ORIGIN }}
      # Preview origin·bypass·테스트 계정 secret은 job env에 두지 않는다.
      # 의존성·브라우저 설치와 setup 액션에는 노출하지 않고, 값을 읽는 step env에만 둔다.
      PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/.artifacts/round-direct/generic-${{ github.run_id }}-${{ github.run_attempt }}/playwright-raw.json

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: Playwright chromium 설치
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: generic Preview 필수 입력 확인
        shell: bash
        env:
          SELLER_BASE: ${{ secrets.SELLER_BASE }}
          CONSUMER_BASE: ${{ secrets.CONSUMER_BASE }}
          DRIVER_BASE: ${{ secrets.DRIVER_BASE }}
          SELLER_BYPASS_SECRET: ${{ secrets.SELLER_BYPASS_SECRET }}
          CONSUMER_BYPASS_SECRET: ${{ secrets.CONSUMER_BYPASS_SECRET }}
          DRIVER_BYPASS_SECRET: ${{ secrets.DRIVER_BYPASS_SECRET }}
          E2E_TEST_SECRET: ${{ secrets.E2E_TEST_SECRET }}
          TEST_SELLER_EMAIL: ${{ secrets.TEST_SELLER_EMAIL }}
          TEST_SELLER_PASSWORD: ${{ secrets.TEST_SELLER_PASSWORD }}
          TEST_CONSUMER_EMAIL: ${{ secrets.TEST_CONSUMER_EMAIL }}
          TEST_CONSUMER_PASSWORD: ${{ secrets.TEST_CONSUMER_PASSWORD }}
        run: |
          set -euo pipefail
          required=(
            CONSUMER_BASE
            SELLER_BASE
            DRIVER_BASE
            CONSUMER_BYPASS_SECRET
            SELLER_BYPASS_SECRET
            DRIVER_BYPASS_SECRET
            E2E_TEST_SECRET
            TEST_CONSUMER_EMAIL
            TEST_CONSUMER_PASSWORD
            TEST_SELLER_EMAIL
            TEST_SELLER_PASSWORD
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "필수 generic Preview 입력이 없습니다: $name" >&2
              exit 1
            fi
          done

      - name: Firebase와 API 비운영 target 확인
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SELLER_BASE: ${{ secrets.SELLER_BASE }}
          CONSUMER_BASE: ${{ secrets.CONSUMER_BASE }}
          DRIVER_BASE: ${{ secrets.DRIVER_BASE }}
        run: |
          set -euo pipefail
          evidence_root=".artifacts/round-direct/$ROUND_DIRECT_E2E_RUN_ID/evidence"
          mkdir -p "$evidence_root"
          node scripts/check-round-direct-e2e-readiness.mjs --target-only > "$evidence_root/firebase-target.json"

      - name: generic Preview fixture seed
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TEST_SELLER_EMAIL: ${{ secrets.TEST_SELLER_EMAIL }}
          TEST_SELLER_PASSWORD: ${{ secrets.TEST_SELLER_PASSWORD }}
          TEST_CONSUMER_EMAIL: ${{ secrets.TEST_CONSUMER_EMAIL }}
          TEST_CONSUMER_PASSWORD: ${{ secrets.TEST_CONSUMER_PASSWORD }}
        run: |
          set -euo pipefail
          evidence_root=".artifacts/round-direct/$ROUND_DIRECT_E2E_RUN_ID"
          mkdir -p "$evidence_root/evidence"
          node scripts/round-direct-e2e-fixtures.mjs seed --project=generic --manifest="$evidence_root/generic/manifest.json" > "$evidence_root/seed-generic-raw.json"
          jq '{action, runId, project, ready, missingDocumentCount: (.missingDocuments | length), missingObjectCount: (.missingObjects | length)}' "$evidence_root/seed-generic-raw.json" > "$evidence_root/evidence/seed-generic.json"

      - name: generic Preview fixture verify
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          evidence_root=".artifacts/round-direct/$ROUND_DIRECT_E2E_RUN_ID"
          node scripts/round-direct-e2e-fixtures.mjs verify --project=generic --manifest="$evidence_root/generic/manifest.json" > "$evidence_root/verify-generic-raw.json"
          jq '{action, runId, project, ready, missingDocumentCount: (.missingDocuments | length), missingObjectCount: (.missingObjects | length)}' "$evidence_root/verify-generic-raw.json" > "$evidence_root/evidence/verify-generic.json"

      - name: generic Preview E2E 실행
        id: e2e
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SELLER_BASE: ${{ secrets.SELLER_BASE }}
          CONSUMER_BASE: ${{ secrets.CONSUMER_BASE }}
          DRIVER_BASE: ${{ secrets.DRIVER_BASE }}
          SELLER_BYPASS_SECRET: ${{ secrets.SELLER_BYPASS_SECRET }}
          CONSUMER_BYPASS_SECRET: ${{ secrets.CONSUMER_BYPASS_SECRET }}
          DRIVER_BYPASS_SECRET: ${{ secrets.DRIVER_BYPASS_SECRET }}
          E2E_TEST_SECRET: ${{ secrets.E2E_TEST_SECRET }}
          TEST_SELLER_EMAIL: ${{ secrets.TEST_SELLER_EMAIL }}
          TEST_SELLER_PASSWORD: ${{ secrets.TEST_SELLER_PASSWORD }}
          TEST_CONSUMER_EMAIL: ${{ secrets.TEST_CONSUMER_EMAIL }}
          TEST_CONSUMER_PASSWORD: ${{ secrets.TEST_CONSUMER_PASSWORD }}
        run: >-
          pnpm --filter e2e exec playwright test
          --project=chromium
          --grep-invert '회차 직배송|회차 운영'
          --reporter=list,json

      - name: generic Preview fixture cleanup
        id: cleanup_generic
        if: ${{ always() }}
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          evidence_root=".artifacts/round-direct/$ROUND_DIRECT_E2E_RUN_ID"
          manifest="$evidence_root/generic/manifest.json"
          mkdir -p "$evidence_root/evidence"
          if [[ ! -f "$manifest" ]]; then
            printf '{"action":"cleanup","project":"generic","status":"not-seeded","remainingDocumentCount":0,"remainingObjectCount":0}\n' > "$evidence_root/evidence/cleanup-generic.json"
            exit 0
          fi
          node scripts/round-direct-e2e-fixtures.mjs cleanup --project=generic --manifest="$manifest" > "$evidence_root/cleanup-generic-raw.json"
          jq '{action, runId, project, ready, remainingDocumentCount: (.remainingDocuments | length), remainingObjectCount: (.remainingObjects | length)}' "$evidence_root/cleanup-generic-raw.json" > "$evidence_root/evidence/cleanup-generic.json"

      - name: 비민감 실행 요약 생성
        if: ${{ always() }}
        shell: bash
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup_generic.outcome }}
        run: |
          set -euo pipefail
          evidence_root=".artifacts/round-direct/$ROUND_DIRECT_E2E_RUN_ID"
          mkdir -p "$evidence_root/evidence"
          if [[ -f "$PLAYWRIGHT_JSON_OUTPUT_FILE" ]]; then
            jq '{expected: .stats.expected, skipped: .stats.skipped, unexpected: .stats.unexpected, flaky: .stats.flaky, durationMs: .stats.duration}' "$PLAYWRIGHT_JSON_OUTPUT_FILE" > "$evidence_root/evidence/playwright-summary.json"
          else
            printf '{"status":"not-run"}\n' > "$evidence_root/evidence/playwright-summary.json"
          fi
          jq -n --arg runId "$ROUND_DIRECT_E2E_RUN_ID" --arg e2eOutcome "$E2E_OUTCOME" --arg cleanupOutcome "$CLEANUP_OUTCOME" '{
              runId: $runId,
              testResult: {e2e: $e2eOutcome},
              cleanupResult: {generic: $cleanupOutcome}
            }' > "$evidence_root/evidence/workflow-summary.json"

      - name: 비민감 증거 artifact 업로드
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/round-direct/generic-${{ github.run_id }}-${{ github.run_attempt }}/evidence/
          if-no-files-found: error
          retention-days: 7
