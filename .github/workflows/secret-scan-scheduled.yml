name: Secret scan (scheduled)

# 매주 저장소 전체 이력(모든 브랜치)을 비밀값 검사한다. 외부 서비스·비밀값을 쓰지 않는다.
# trufflehog는 파일·줄·탐지 종류만 출력하고 값은 출력하지 않는다.
# - 보고: 검증하지 않은 결과(`.trufflehog.yml` 사용자 정의 규칙 포함)를 경고 주석으로 남긴다.
#   과거 이력에 이미 남은 결과가 있어 실패로 두지 않는다. 새 경고가 보이면 값을 교체하고 정리한다.
# - 실패: 기본 탐지기가 실제로 유효하다고 확인한 값이 하나라도 있으면 실패한다.
# 외부 액션은 커밋 SHA로 고정하고 버전을 주석으로 남긴다.
on:
  schedule:
    - cron: '41 2 * * 1' # 매주 월요일 02:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-scheduled
  cancel-in-progress: false

jobs:
  full-history:
    name: secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scan (full history, report unverified)
        continue-on-error: true
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          version: 3.99.2@sha256:47a84bc18a0d04a165498bbbd3bacfd84176661cbc91f8e0f85467f6a771e99a
          extra_args: --no-verification --config=.trufflehog.yml --exclude-paths=.github/trufflehog-exclude-paths.txt
      - name: Secret scan (full history, verified fails)
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          version: 3.99.2@sha256:47a84bc18a0d04a165498bbbd3bacfd84176661cbc91f8e0f85467f6a771e99a
          extra_args: --only-verified --config=.trufflehog.yml --exclude-paths=.github/trufflehog-exclude-paths.txt
