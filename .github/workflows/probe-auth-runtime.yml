name: Auth runtime probe (deterministic + session-only)

on:
  workflow_dispatch:
    inputs:
      runner_sha:
        description: 'session-only probe runner를 실행할 repository exact commit SHA'
        required: true
        type: string
      expected_sha:
        description: '세 Preview 앱이 가리켜야 하는 40자리 commit SHA'
        required: true
        type: string
      consumer_deployment_id:
        description: 'consumer의 직접 검증 대상 Vercel deployment ID'
        required: true
        type: string
      seller_deployment_id:
        description: 'seller의 직접 검증 대상 Vercel deployment ID'
        required: true
        type: string
      driver_deployment_id:
        description: 'driver의 직접 검증 대상 Vercel deployment ID'
        required: true
        type: string
      approval:
        description: '비운영 session-only auth probe 실행을 승인합니다.'
        required: true
        type: choice
        options:
          - NON_PRODUCTION_AUTH_PROBE_APPROVED
  pull_request:
    paths:
      - scripts/probe-auth-runtime.mjs
      - scripts/probe-auth-runtime.spec.mjs
      - scripts/probe-auth-runtime.workflow.spec.mjs
      - scripts/probe-consumer-callback.mjs
      - scripts/probe-consumer-callback.spec.mjs
      - scripts/probe-consumer-callback.workflow.spec.mjs
      - scripts/probe-auth-identities.mjs
      - scripts/probe-auth-identities.spec.mjs
      - .github/workflows/probe-auth-runtime.yml

permissions:
  contents: read

jobs:
  probe-spec:
    name: probe runner deterministic spec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6

      - name: 의존성 설치 (deterministic spec bcrypt/fixture parity)
        run: pnpm install --frozen-lockfile

      - name: run probe deterministic spec (mock/local only, no external calls)
        run: node --test scripts/probe-auth-runtime.spec.mjs scripts/probe-auth-runtime.workflow.spec.mjs scripts/probe-consumer-callback.spec.mjs scripts/probe-consumer-callback.workflow.spec.mjs scripts/probe-auth-identities.spec.mjs

  approval_gate:
    name: session-only probe approval preflight
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: dispatch·actor·approval·SHA·deployment preflight
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          APPROVAL: ${{ inputs.approval }}
          RUNNER_SHA: ${{ inputs.runner_sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONSUMER_DEPLOYMENT_ID: ${{ inputs.consumer_deployment_id }}
          SELLER_DEPLOYMENT_ID: ${{ inputs.seller_deployment_id }}
          DRIVER_DEPLOYMENT_ID: ${{ inputs.driver_deployment_id }}
        run: |
          set -euo pipefail
          printf 'event_name=%s\n' "$EVENT_NAME"
          printf 'actor=%s\n' "$ACTOR"
          printf 'triggering_actor=%s\n' "$TRIGGERING_ACTOR"
          printf 'repository_owner=%s\n' "$REPOSITORY_OWNER"
          printf 'runner_sha=%s\n' "$RUNNER_SHA"
          printf 'expected_sha=%s\n' "$EXPECTED_SHA"
          if [[ "$EVENT_NAME" != 'workflow_dispatch' ]]; then
            echo 'workflow_dispatch 이외의 이벤트에서는 session-only probe를 실행할 수 없습니다.' >&2
            exit 1
          fi
          if [[ "$ACTOR" != "$REPOSITORY_OWNER" ]]; then
            echo 'workflow 실행자가 repository owner와 달라 실행을 차단합니다.' >&2
            exit 1
          fi
          if [[ "$TRIGGERING_ACTOR" != "$REPOSITORY_OWNER" ]]; then
            echo 'workflow triggering actor가 repository owner와 달라 실행을 차단합니다.' >&2
            exit 1
          fi
          if [[ "$APPROVAL" != 'NON_PRODUCTION_AUTH_PROBE_APPROVED' ]]; then
            echo 'session-only probe 수동 승인이 없어 실행을 차단합니다.' >&2
            exit 1
          fi
          if [[ ! "$RUNNER_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'runner SHA는 40자리 소문자 16진수여야 합니다.' >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '지정 SHA는 40자리 소문자 16진수여야 합니다.' >&2
            exit 1
          fi
          for deployment_id in \
            "$CONSUMER_DEPLOYMENT_ID" \
            "$SELLER_DEPLOYMENT_ID" \
            "$DRIVER_DEPLOYMENT_ID"; do
            if [[ ! "$deployment_id" =~ ^dpl_[A-Za-z0-9]+$ ]]; then
              echo 'pinned Vercel deployment ID 형식이 올바르지 않습니다.' >&2
              exit 1
            fi
          done

  auth_identity_seed:
    name: auth probe identity seed (3-role, invocation-owned)
    # Bounded identity lifecycle (PILOT-AUTH-PROBE-IDENTITY-LIFECYCLE-26A):
    # approval_gate -> auth_identity_seed -> session-probe/callback-probe
    # -> auth_identity_cleanup(always). This job prepares exactly 3 owned
    # user docs (consumer/seller/driver) in the staging dataset
    # greenhub-round-direct-e2e via scripts/probe-auth-identities.mjs. It
    # never runs the full round-direct fixture seed and never creates
    # products/orders/saleRounds/storage objects or a production store.
    # Credential source reuses only the approved chromium Environment
    # secrets (mapped to TEST_* env below); no new secret is introduced.
    # Service-account usage is scoped to this job and the cleanup job only;
    # session/callback probe jobs never handle raw service-account material.
    needs: approval_gate
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: auth-probe-identities
      cancel-in-progress: false
    environment:
      name: round-direct-e2e
    permissions:
      contents: read
    env:
      AUTH_PROBE_IDENTITY_RUN_ID: auth-probe-${{ github.run_id }}-${{ github.run_attempt }}
      AUTH_PROBE_RUNNER_SHA: ${{ inputs.runner_sha }}
      AUTH_PROBE_EXPECTED_SHA: ${{ inputs.expected_sha }}
      ROUND_DIRECT_E2E_ENABLED: 'true'
      ROUND_DIRECT_E2E_ENV: preview
      NODE_ENV: test
      VERCEL_ENV: preview
      RAILWAY_ENVIRONMENT_NAME: staging
      FIREBASE_PROJECT_ID: ${{ vars.ROUND_DIRECT_E2E_FIREBASE_PROJECT_ID }}
      ROUND_DIRECT_E2E_ALLOWED_FIREBASE_PROJECTS: ${{ vars.ROUND_DIRECT_E2E_ALLOWED_FIREBASE_PROJECTS }}
    steps:
      - name: runner SHA checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.runner_sha }}
          fetch-depth: 0

      - name: 수동 승인과 runner checkout SHA 확인
        shell: bash
        env:
          APPROVAL: ${{ inputs.approval }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != 'workflow_dispatch' ]]; then
            echo 'workflow_dispatch 이외의 이벤트에서는 auth probe identity를 준비할 수 없습니다.' >&2
            exit 1
          fi
          if [[ "$ACTOR" != "$REPOSITORY_OWNER" ]]; then
            echo 'workflow 실행자가 repository owner와 달라 실행을 차단합니다.' >&2
            exit 1
          fi
          if [[ "$TRIGGERING_ACTOR" != "$REPOSITORY_OWNER" ]]; then
            echo 'workflow triggering actor가 repository owner와 달라 실행을 차단합니다.' >&2
            exit 1
          fi
          if [[ "$APPROVAL" != 'NON_PRODUCTION_AUTH_PROBE_APPROVED' ]]; then
            echo 'auth probe 수동 승인이 없어 실행을 차단합니다.' >&2
            exit 1
          fi
          if [[ ! "$AUTH_PROBE_RUNNER_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'runner SHA는 40자리 소문자 16진수여야 합니다.' >&2
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$AUTH_PROBE_RUNNER_SHA" ]]; then
            echo 'checkout SHA가 runner SHA와 달라 실행을 차단합니다.' >&2
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6

      - name: 의존성 설치 (identity seed only)
        run: pnpm install --frozen-lockfile

      - name: auth probe identities seed/verify (3-role, non-production only)
        shell: bash
        env:
          NON_PRODUCTION_AUTH_PROBE_APPROVAL: ${{ inputs.approval }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.ROUND_DIRECT_E2E_FIREBASE_SERVICE_ACCOUNT_JSON }}
          TEST_CONSUMER_EMAIL: ${{ secrets.ROUND_DIRECT_E2E_CONSUMER_EMAIL_CHROMIUM }}
          TEST_CONSUMER_PASSWORD: ${{ secrets.ROUND_DIRECT_E2E_CONSUMER_PASSWORD_CHROMIUM }}
          TEST_SELLER_EMAIL: ${{ secrets.ROUND_DIRECT_E2E_SELLER_EMAIL_CHROMIUM }}
          TEST_SELLER_PASSWORD: ${{ secrets.ROUND_DIRECT_E2E_SELLER_PASSWORD_CHROMIUM }}
          TEST_DRIVER_EMAIL: ${{ secrets.ROUND_DIRECT_E2E_DRIVER_EMAIL_CHROMIUM }}
          TEST_DRIVER_PASSWORD: ${{ secrets.ROUND_DIRECT_E2E_DRIVER_PASSWORD_CHROMIUM }}
        run: |
          set -euo pipefail
          # Secret-name mapping note (values never logged):
          # - FIREBASE_SERVICE_ACCOUNT_JSON <- ROUND_DIRECT_E2E_FIREBASE_SERVICE_ACCOUNT_JSON
          # - TEST_* per-role identity <- approved chromium Environment secrets
          # Target guard (enabled/preview/non-production/staging project/
          # allowlist/service-account match) runs inside the script before
          # any Firestore mutation. No product/order/round/storage seed.
          evidence_root=".artifacts/auth-probe-identities/$AUTH_PROBE_IDENTITY_RUN_ID"
          mkdir -p "$evidence_root/evidence"
          set +e
          node scripts/probe-auth-identities.mjs \
            seed \
            --run-id="$AUTH_PROBE_IDENTITY_RUN_ID" \
            --manifest="$evidence_root/evidence/identity-manifest.json" \
            > "$evidence_root/seed-raw.json"
          seed_status=$?
          set -e
          if [[ ! -s "$evidence_root/seed-raw.json" ]]; then
            echo 'identity seed 요약을 만들지 못해 실행을 차단합니다.' >&2
            exit 1
          fi
          jq '{
            action,
            runId,
            ready,
            evidence: (.evidence | {
              purpose,
              runId,
              documentPaths,
              storeIdPresent,
              storeIdIsProduction,
              roles,
              failureCodes
            })
            }' \
            "$evidence_root/seed-raw.json" \
            > "$evidence_root/evidence/identity-summary.json"
          exit "$seed_status"

      - name: 비민감 identity 증거 artifact 업로드
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: auth-probe-identities-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/auth-probe-identities/${{ env.AUTH_PROBE_IDENTITY_RUN_ID }}/evidence/
          if-no-files-found: error
          retention-days: 7

  session-probe:
    name: pinned Preview session-only auth probe
    # Session-only boundary: this job exercises ONLY the existing
    # scripts/probe-auth-runtime.mjs contract (pinned binding read plus
    # /auth/login, /auth/me, /auth/logout per role). It never invokes the
    # full multi-case suite, fixture seed/verify/cleanup scripts, order or
    # payment flows, provider hosts, registration, or any mutation path.
    # Negative fixture creation is out of scope: when no approved negative
    # identity is configured the evidence records
    # NEGATIVE_IDENTITY_NOT_CONFIGURED instead of failing the probe itself.
    # Identity lifecycle: this job runs ONLY after auth_identity_seed
    # succeeds (owned 3-role identities exist in staging). It never handles
    # raw service-account material; identity mutation lives only in the
    # seed/cleanup jobs.
    needs: auth_identity_seed
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: auth-session-probe
      cancel-in-progress: false
    environment:
      # Private-plan note mirrors the round-direct workflow: secret scope
      # lives in this Environment while the single-operator preflight above
      # keeps the fail-closed approval contract.
      name: round-direct-e2e
    permissions:
      contents: read
    env:
      AUTH_PROBE_RUN_ID: auth-session-${{ github.run_id }}-${{ github.run_attempt }}
      AUTH_PROBE_RUN_ATTEMPT: ${{ github.run_attempt }}
      AUTH_PROBE_EVENT_NAME: ${{ github.event_name }}
      AUTH_PROBE_ACTOR: ${{ github.actor }}
      AUTH_PROBE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      AUTH_PROBE_WORKFLOW_SHA: ${{ github.sha }}
      AUTH_PROBE_RUNNER_SHA: ${{ inputs.runner_sha }}
      AUTH_PROBE_EXPECTED_SHA: ${{ inputs.expected_sha }}
      AUTH_PROBE_CONSUMER_DEPLOYMENT_ID: ${{ inputs.consumer_deployment_id }}
      AUTH_PROBE_SELLER_DEPLOYMENT_ID: ${{ inputs.seller_deployment_id }}
      AUTH_PROBE_DRIVER_DEPLOYMENT_ID: ${{ inputs.driver_deployment_id }}
      AUTH_PROBE_API_ORIGIN: ${{ vars.ROUND_DIRECT_E2E_API_ORIGIN }}
      AUTH_PROBE_ALLOWED_API_ORIGINS: ${{ vars.ROUND_DIRECT_E2E_ALLOWED_API_ORIGINS }}
      FIREBASE_PROJECT_ID: ${{ vars.ROUND_DIRECT_E2E_FIREBASE_PROJECT_ID }}

    steps:
      - name: runner SHA checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.runner_sha }}
          fetch-depth: 0

      - name: 수동 승인과 runner checkout SHA 확인
        shell: bash
        env:
          APPROVAL: ${{ inputs.approval }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != 'workflow_dispatch' ]]; then
            echo 'workflow_dispatch 이외의 이벤트에서는 session-only probe를 실행할 수 없습니다.' >&2
            exit 1
          fi
          if [[ "$ACTOR" != "$REPOSITORY_OWNER" ]]; then
            echo 'workflow 실행자가 repository owner와 달라 실행을 차단합니다.' >&2
            exit 1
          fi
          if [[ "$TRIGGERING_ACTOR" != "$REPOSITORY_OWNER" ]]; then
            echo 'workflow triggering actor가 repository owner와 달라 실행을 차단합니다.' >&2
            exit 1
          fi
          if [[ "$APPROVAL" != 'NON_PRODUCTION_AUTH_PROBE_APPROVED' ]]; then
            echo 'session-only probe 수동 승인이 없어 실행을 차단합니다.' >&2
            exit 1
          fi
          if [[ ! "$AUTH_PROBE_RUNNER_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'runner SHA는 40자리 소문자 16진수여야 합니다.' >&2
            exit 1
          fi
          if [[ ! "$AUTH_PROBE_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '지정 SHA는 40자리 소문자 16진수여야 합니다.' >&2
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$AUTH_PROBE_RUNNER_SHA" ]]; then
            echo 'checkout SHA가 runner SHA와 달라 실행을 차단합니다.' >&2
            exit 1
          fi
          printf 'AUTH_PROBE_CHECKOUT_SHA=%s\n' "$actual_sha" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: 세 pinned Vercel deployment metadata 직접 확인
        shell: bash
        env:
          ROUND_DIRECT_E2E_VERCEL_READ_TOKEN: ${{ secrets.ROUND_DIRECT_E2E_VERCEL_READ_TOKEN }}
        run: |
          set -euo pipefail
          evidence_root=".artifacts/auth-session-probe/$AUTH_PROBE_RUN_ID"
          mkdir -p "$evidence_root/evidence"
          set +e
          node scripts/wait-preview-deploy.mjs \
            --json \
            --sha="$AUTH_PROBE_EXPECTED_SHA" \
            --consumer-deployment-id="$AUTH_PROBE_CONSUMER_DEPLOYMENT_ID" \
            --seller-deployment-id="$AUTH_PROBE_SELLER_DEPLOYMENT_ID" \
            --driver-deployment-id="$AUTH_PROBE_DRIVER_DEPLOYMENT_ID" \
            > "$evidence_root/deployment-raw.json"
          wait_status=$?
          set -e
          if [[ ! -s "$evidence_root/deployment-raw.json" ]]; then
            echo '배포 증거 JSON을 만들지 못해 실행을 차단합니다.' >&2
            exit 1
          fi
          jq -c '.deploymentShas' "$evidence_root/deployment-raw.json" \
            | sed 's/^/AUTH_PROBE_DEPLOYMENT_SHAS_JSON=/' >> "$GITHUB_ENV"
          jq -c '.deploymentTargetUrls' "$evidence_root/deployment-raw.json" \
            | sed 's/^/AUTH_PROBE_TARGET_URLS_JSON=/' >> "$GITHUB_ENV"
          if [[ "$wait_status" -eq 0 ]]; then
            jq -er '.deploymentTargetUrls.consumer' "$evidence_root/deployment-raw.json" \
              | sed 's/^/AUTH_PROBE_CONSUMER_URL=/' >> "$GITHUB_ENV"
            jq -er '.deploymentTargetUrls.seller' "$evidence_root/deployment-raw.json" \
              | sed 's/^/AUTH_PROBE_SELLER_URL=/' >> "$GITHUB_ENV"
            jq -er '.deploymentTargetUrls.driver' "$evidence_root/deployment-raw.json" \
              | sed 's/^/AUTH_PROBE_DRIVER_URL=/' >> "$GITHUB_ENV"
          fi
          jq '{
            ready,
            evidenceSource,
            checkedAt,
            repository,
            expectedSha,
            pinnedDeploymentIds,
            deploymentIds,
            deploymentShas,
            deploymentTargetUrls,
            deploymentStates,
            failureCodes,
            apps: [.apps[] | {
              app,
              project,
              projectId,
              environment,
              deploymentId,
              deploymentSha,
              state,
              readyState,
              target,
              target_url: .targetUrl,
              failureCode,
              ready
            }]
            }' \
            "$evidence_root/deployment-raw.json" \
            > "$evidence_root/evidence/deployment.json"
          jq --arg apiOrigin "$AUTH_PROBE_API_ORIGIN" \
            '. + {apiOrigin: $apiOrigin}' \
            "$evidence_root/deployment-raw.json" \
            > "$evidence_root/probe-evidence.json"
          exit "$wait_status"

      - name: 승인된 비운영 API origin 확인
        shell: bash
        run: |
          set -euo pipefail
          api_origin="$(printf '%s' "${AUTH_PROBE_API_ORIGIN:-}" | tr -d '[:space:]')"
          if [[ -z "$api_origin" ]]; then
            echo '비운영 API origin이 비어 있어 실행을 차단합니다.' >&2
            exit 1
          fi
          case "$api_origin" in
            https://*) ;;
            *) echo 'API origin은 https만 허용합니다.' >&2; exit 1 ;;
          esac
          api_host="$(printf '%s' "$api_origin" | sed -e 's#^https://##' -e 's#/.*$##' -e 's#:.*$##' | tr '[:upper:]' '[:lower:]')"
          case "$api_host" in
            greenlove.co.kr|*.greenlove.co.kr|api-production-*)
              echo '운영 API origin이므로 실행을 차단합니다.' >&2
              exit 1
              ;;
          esac
          if [[ "$api_host" == 'api-production-13e7.up.railway.app' ]]; then
            echo '운영 API origin이므로 실행을 차단합니다.' >&2
            exit 1
          fi
          allowed="$(printf '%s' "${AUTH_PROBE_ALLOWED_API_ORIGINS:-}")"
          match_found='false'
          IFS=',' read -ra allowed_list <<< "$allowed"
          for entry in "${allowed_list[@]}"; do
            candidate="$(printf '%s' "$entry" | tr -d '[:space:]')"
            if [[ -n "$candidate" && "$candidate" == "$api_origin" ]]; then
              match_found='true'
              break
            fi
          done
          if [[ "$match_found" != 'true' ]]; then
            echo 'API origin이 비운영 허용 목록과 달라 실행을 차단합니다.' >&2
            exit 1
          fi
          printf 'api_origin=%s\n' "$api_origin"

      - name: session-only auth probe 실행
        shell: bash
        env:
          E2E_TEST_SECRET: ${{ secrets.ROUND_DIRECT_E2E_TEST_SECRET }}
          ROUND_DIRECT_E2E_SHARED_SECRET: ${{ secrets.ROUND_DIRECT_E2E_SHARED_SECRET }}
          ROUND_DIRECT_E2E_DRIVER_EMAILS: ${{ secrets.ROUND_DIRECT_E2E_DRIVER_EMAIL_CHROMIUM }}
          ROUND_DIRECT_E2E_ENABLED: 'true'
          VERCEL_ENV: preview
          NODE_ENV: test
          RAILWAY_ENVIRONMENT_NAME: staging
          GREENHUB_LOCAL_RUNTIME: ''
          TEST_CONSUMER_EMAIL: ${{ secrets.ROUND_DIRECT_E2E_CONSUMER_EMAIL_CHROMIUM }}
          TEST_CONSUMER_PASSWORD: ${{ secrets.ROUND_DIRECT_E2E_CONSUMER_PASSWORD_CHROMIUM }}
          TEST_SELLER_EMAIL: ${{ secrets.ROUND_DIRECT_E2E_SELLER_EMAIL_CHROMIUM }}
          TEST_SELLER_PASSWORD: ${{ secrets.ROUND_DIRECT_E2E_SELLER_PASSWORD_CHROMIUM }}
          TEST_DRIVER_EMAIL: ${{ secrets.ROUND_DIRECT_E2E_DRIVER_EMAIL_CHROMIUM }}
          TEST_DRIVER_PASSWORD: ${{ secrets.ROUND_DIRECT_E2E_DRIVER_PASSWORD_CHROMIUM }}
          AUTH_PROBE_CONSUMER_TOKEN: ${{ secrets.ROUND_DIRECT_E2E_TEST_SECRET }}
          AUTH_PROBE_SELLER_TOKEN: ${{ secrets.ROUND_DIRECT_E2E_TEST_SECRET }}
          AUTH_PROBE_DRIVER_SECRET: ${{ secrets.ROUND_DIRECT_E2E_SHARED_SECRET }}
        run: |
          set -euo pipefail
          # Secret-name mapping note (values never logged):
          # - E2E_TEST_SECRET / AUTH_PROBE_*_TOKEN <- ROUND_DIRECT_E2E_TEST_SECRET
          # - ROUND_DIRECT_E2E_SHARED_SECRET / AUTH_PROBE_DRIVER_SECRET <-
          #   ROUND_DIRECT_E2E_SHARED_SECRET (approved Environment secret reuse)
          # - TEST_* per-role identity <- approved chromium Environment secrets
          # - client pre-check allowlist <- same approved chromium driver
          #   identity value; the server-side allowlist stays authoritative.
          # No service-account, fixture, or provider secret is bound here.
          evidence_root=".artifacts/auth-session-probe/$AUTH_PROBE_RUN_ID"
          mkdir -p "$evidence_root/evidence"
          set +e
          node scripts/probe-auth-runtime.mjs \
            --expected-sha="$AUTH_PROBE_EXPECTED_SHA" \
            --consumer-url="$AUTH_PROBE_CONSUMER_URL" \
            --seller-url="$AUTH_PROBE_SELLER_URL" \
            --driver-url="$AUTH_PROBE_DRIVER_URL" \
            --api-url="$AUTH_PROBE_API_ORIGIN" \
            --evidence-json="$evidence_root/probe-evidence.json" \
            --approval="${{ inputs.approval }}" \
            > "$evidence_root/probe-raw.json"
          probe_status=$?
          set -e
          if [[ ! -s "$evidence_root/probe-raw.json" ]]; then
            echo 'probe 요약을 만들지 못해 실행을 차단합니다.' >&2
            exit 1
          fi
          jq '{
            runner,
            result,
            expectedSha,
            targets,
            roles: (.roles | with_entries(.value |= ({status, failureCode, steps, user, httpStatus, rejectionClass, step, role}))),
            failureCodes,
            bindingFailure,
            authSessionClaimRevocation
            }' \
            "$evidence_root/probe-raw.json" \
            > "$evidence_root/evidence/probe-summary.json"
          checked_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg runId "$AUTH_PROBE_RUN_ID" \
            --arg runAttempt "$AUTH_PROBE_RUN_ATTEMPT" \
            --arg eventName "$AUTH_PROBE_EVENT_NAME" \
            --arg actor "$AUTH_PROBE_ACTOR" \
            --arg triggeringActor "$AUTH_PROBE_TRIGGERING_ACTOR" \
            --arg workflowSha "$AUTH_PROBE_WORKFLOW_SHA" \
            --arg runnerSha "$AUTH_PROBE_RUNNER_SHA" \
            --arg expectedSha "$AUTH_PROBE_EXPECTED_SHA" \
            --arg expectedFrontendSha "$AUTH_PROBE_EXPECTED_SHA" \
            --arg checkoutSha "$AUTH_PROBE_CHECKOUT_SHA" \
            --arg consumerDeploymentId "$AUTH_PROBE_CONSUMER_DEPLOYMENT_ID" \
            --arg sellerDeploymentId "$AUTH_PROBE_SELLER_DEPLOYMENT_ID" \
            --arg driverDeploymentId "$AUTH_PROBE_DRIVER_DEPLOYMENT_ID" \
            --arg checkedAt "$checked_at" \
            --argjson targetUrls "$AUTH_PROBE_TARGET_URLS_JSON" \
            --argjson deploymentShas "$AUTH_PROBE_DEPLOYMENT_SHAS_JSON" \
            --slurpfile probe "$evidence_root/evidence/probe-summary.json" \
            --slurpfile deployment "$evidence_root/evidence/deployment.json" \
            '{
              runId: $runId,
              runAttempt: $runAttempt,
              eventName: $eventName,
              actor: $actor,
              triggeringActor: $triggeringActor,
              workflowSha: $workflowSha,
              runnerSha: $runnerSha,
              expectedSha: $expectedSha,
              expectedFrontendSha: $expectedFrontendSha,
              checkoutSha: $checkoutSha,
              pinnedDeploymentIds: {
                consumer: $consumerDeploymentId,
                seller: $sellerDeploymentId,
                driver: $driverDeploymentId
              },
              targetUrls: $targetUrls,
              deploymentTargetUrls: $targetUrls,
              deploymentShas: $deploymentShas,
              deploymentReady: $deployment[0].ready,
              probeResult: $probe[0].result,
              roles: $probe[0].roles,
              failureCodes: $probe[0].failureCodes,
              bindingFailure: $probe[0].bindingFailure,
              authSessionClaimRevocation: $probe[0].authSessionClaimRevocation,
              negativeIdentityStatus: "NEGATIVE_IDENTITY_NOT_CONFIGURED",
              checkedAt: $checkedAt
            }' \
            > "$evidence_root/evidence/workflow-summary.json"
          exit "$probe_status"

      - name: 비민감 증거 artifact 업로드
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: auth-session-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/auth-session-probe/${{ env.AUTH_PROBE_RUN_ID }}/evidence/
          if-no-files-found: error
          retention-days: 7

  callback-probe:
    name: locked Consumer callback input-binding probe
    # Callback isolation boundary: this job exercises ONLY the
    # scripts/probe-consumer-callback.mjs contract against the locked
    # Consumer Preview deployment (CSRF GET -> credentials callback POST
    # with manual redirect -> same-context session readback). It never
    # invokes scripts/probe-auth-runtime.mjs, never widens that runner's
    # ALLOWED_API_PATHS, never merges network allowlists, and never calls
    # seller/driver frontend origins. Identity lifecycle: this job runs
    # ONLY after auth_identity_seed succeeds (owned consumer identity
    # exists in staging) and stays independent of session-probe so a
    # session-probe failure cannot mask or block callback provenance
    # evidence. It never handles raw service-account material.
    needs: auth_identity_seed
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: auth-callback-probe
      cancel-in-progress: false
    environment:
      # Same approved Environment as the session probe: secret scope lives
      # here while the single-operator preflight above keeps the
      # fail-closed approval contract. No secret value is ever logged.
      name: round-direct-e2e
    permissions:
      contents: read
    env:
      AUTH_CALLBACK_RUN_ID: auth-callback-${{ github.run_id }}-${{ github.run_attempt }}
      AUTH_CALLBACK_RUN_ATTEMPT: ${{ github.run_attempt }}
      AUTH_CALLBACK_EVENT_NAME: ${{ github.event_name }}
      AUTH_CALLBACK_ACTOR: ${{ github.actor }}
      AUTH_CALLBACK_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      AUTH_CALLBACK_WORKFLOW_SHA: ${{ github.sha }}
      AUTH_CALLBACK_EXPECTED_SHA: ${{ inputs.expected_sha }}
      AUTH_CALLBACK_CONSUMER_DEPLOYMENT_ID: ${{ inputs.consumer_deployment_id }}
      AUTH_CALLBACK_SELLER_DEPLOYMENT_ID: ${{ inputs.seller_deployment_id }}
      AUTH_CALLBACK_DRIVER_DEPLOYMENT_ID: ${{ inputs.driver_deployment_id }}

    steps:
      - name: probe 코드 checkout (workflow ref)
        uses: actions/checkout@v6
        with:
          # Binding/provenance input (inputs.expected_sha) is the LOCKED
          # deployment source SHA and intentionally differs from the probe
          # code version: the callback runner only exists on post-publication
          # main, so code follows the workflow ref while deployment binding
          # follows inputs.expected_sha. Both SHAs are recorded in evidence.
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: 수동 승인과 checkout SHA 확인
        shell: bash
        env:
          APPROVAL: ${{ inputs.approval }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != 'workflow_dispatch' ]]; then
            echo 'workflow_dispatch 이외의 이벤트에서는 callback probe를 실행할 수 없습니다.' >&2
            exit 1
          fi
          if [[ "$ACTOR" != "$REPOSITORY_OWNER" ]]; then
            echo 'workflow 실행자가 repository owner와 달라 실행을 차단합니다.' >&2
            exit 1
          fi
          if [[ "$TRIGGERING_ACTOR" != "$REPOSITORY_OWNER" ]]; then
            echo 'workflow triggering actor가 repository owner와 달라 실행을 차단합니다.' >&2
            exit 1
          fi
          if [[ "$APPROVAL" != 'NON_PRODUCTION_AUTH_PROBE_APPROVED' ]]; then
            echo 'callback probe 수동 승인이 없어 실행을 차단합니다.' >&2
            exit 1
          fi
          if [[ ! "$AUTH_CALLBACK_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'workflow SHA는 40자리 소문자 16진수여야 합니다.' >&2
            exit 1
          fi
          if [[ ! "$AUTH_CALLBACK_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'binding SHA는 40자리 소문자 16진수여야 합니다.' >&2
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$AUTH_CALLBACK_WORKFLOW_SHA" ]]; then
            echo 'checkout SHA가 workflow SHA와 달라 실행을 차단합니다.' >&2
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: locked Consumer deployment binding 직접 확인
        shell: bash
        env:
          ROUND_DIRECT_E2E_VERCEL_READ_TOKEN: ${{ secrets.ROUND_DIRECT_E2E_VERCEL_READ_TOKEN }}
        run: |
          set -euo pipefail
          evidence_root=".artifacts/auth-callback-probe/$AUTH_CALLBACK_RUN_ID"
          mkdir -p "$evidence_root/evidence"
          set +e
          node scripts/wait-preview-deploy.mjs \
            --json \
            --sha="$AUTH_CALLBACK_EXPECTED_SHA" \
            --consumer-deployment-id="$AUTH_CALLBACK_CONSUMER_DEPLOYMENT_ID" \
            --seller-deployment-id="$AUTH_CALLBACK_SELLER_DEPLOYMENT_ID" \
            --driver-deployment-id="$AUTH_CALLBACK_DRIVER_DEPLOYMENT_ID" \
            > "$evidence_root/deployment-raw.json"
          wait_status=$?
          set -e
          if [[ ! -s "$evidence_root/deployment-raw.json" ]]; then
            echo '배포 증거 JSON을 만들지 못해 실행을 차단합니다.' >&2
            exit 1
          fi
          jq -c '.deploymentShas' "$evidence_root/deployment-raw.json" \
            | sed 's/^/AUTH_CALLBACK_DEPLOYMENT_SHAS_JSON=/' >> "$GITHUB_ENV"
          jq -c '.deploymentTargetUrls' "$evidence_root/deployment-raw.json" \
            | sed 's/^/AUTH_CALLBACK_TARGET_URLS_JSON=/' >> "$GITHUB_ENV"
          jq -er '.ready' "$evidence_root/deployment-raw.json" \
            | sed 's/^/AUTH_CALLBACK_DEPLOYMENT_READY=/' >> "$GITHUB_ENV"
          if [[ "$wait_status" -eq 0 ]]; then
            jq -er '.deploymentTargetUrls.consumer' "$evidence_root/deployment-raw.json" \
              | sed 's/^/AUTH_CALLBACK_CONSUMER_URL=/' >> "$GITHUB_ENV"
          fi
          jq '{
            ready,
            evidenceSource,
            checkedAt,
            repository,
            expectedSha,
            pinnedDeploymentIds,
            deploymentIds,
            deploymentShas,
            deploymentTargetUrls,
            deploymentStates,
            failureCodes,
            apps: [.apps[] | {
              app,
              project,
              projectId,
              environment,
              deploymentId,
              deploymentSha,
              state,
              readyState,
              target,
              target_url: .targetUrl,
              failureCode,
              ready
            }]
            }' \
            "$evidence_root/deployment-raw.json" \
            > "$evidence_root/evidence/deployment.json"
          jq --arg expectedSha "$AUTH_CALLBACK_EXPECTED_SHA" \
            '. + {expectedSha: $expectedSha}' \
            "$evidence_root/deployment-raw.json" \
            > "$evidence_root/probe-evidence.json"
          exit "$wait_status"

      - name: locked Consumer frontend origin 확인
        shell: bash
        run: |
          set -euo pipefail
          consumer_url="$(printf '%s' "${AUTH_CALLBACK_CONSUMER_URL:-}" | tr -d '[:space:]')"
          if [[ -z "$consumer_url" ]]; then
            echo 'callback 대상 consumer URL이 비어 있어 실행을 차단합니다.' >&2
            exit 1
          fi
          case "$consumer_url" in
            https://*) ;;
            *) echo 'callback 대상은 https만 허용합니다.' >&2; exit 1 ;;
          esac
          consumer_host="$(printf '%s' "$consumer_url" | sed -e 's#^https://##' -e 's#/.*$##' -e 's#:.*$##' | tr '[:upper:]' '[:lower:]')"
          case "$consumer_host" in
            greenlove.co.kr|*.greenlove.co.kr|api-production-*)
              echo '운영 consumer origin이므로 실행을 차단합니다.' >&2
              exit 1
              ;;
          esac
          if [[ "$consumer_host" == 'api-production-13e7.up.railway.app' ]]; then
            echo '운영 consumer origin이므로 실행을 차단합니다.' >&2
            exit 1
          fi
          case "$consumer_host" in
            *.vercel.app) ;;
            *) echo 'callback 대상이 locked Preview deployment 호스트가 아닙니다.' >&2; exit 1 ;;
          esac
          printf 'consumer_host=%s\n' "$consumer_host"

      - name: locked Consumer callback probe 실행
        shell: bash
        env:
          E2E_TEST_SECRET: ${{ secrets.ROUND_DIRECT_E2E_TEST_SECRET }}
          TEST_CONSUMER_EMAIL: ${{ secrets.ROUND_DIRECT_E2E_CONSUMER_EMAIL_CHROMIUM }}
          TEST_CONSUMER_PASSWORD: ${{ secrets.ROUND_DIRECT_E2E_CONSUMER_PASSWORD_CHROMIUM }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.ROUND_DIRECT_E2E_CONSUMER_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          # Secret-name mapping note (values never logged):
          # - E2E_TEST_SECRET <- ROUND_DIRECT_E2E_TEST_SECRET
          # - TEST_CONSUMER_EMAIL <- ROUND_DIRECT_E2E_CONSUMER_EMAIL_CHROMIUM
          # - TEST_CONSUMER_PASSWORD <- ROUND_DIRECT_E2E_CONSUMER_PASSWORD_CHROMIUM
          # - VERCEL_AUTOMATION_BYPASS_SECRET <- ROUND_DIRECT_E2E_CONSUMER_BYPASS_SECRET
          #   (Vercel protection passage only; never merged with x-e2e-test-token)
          # The approved Environment secret input is passed to the probe via
          # env only; the probe records credentialSource/headerName/
          # headerPresent + protectionPassageMode/protectionBypassHeaderName/
          # protectionBypassHeaderPresent provenance metadata and never
          # serializes values.
          # No seller/driver frontend origin is called by this step.
          evidence_root=".artifacts/auth-callback-probe/$AUTH_CALLBACK_RUN_ID"
          mkdir -p "$evidence_root/evidence"
          set +e
          node scripts/probe-consumer-callback.mjs \
            --expected-sha="$AUTH_CALLBACK_EXPECTED_SHA" \
            --consumer-url="$AUTH_CALLBACK_CONSUMER_URL" \
            --consumer-deployment-id="$AUTH_CALLBACK_CONSUMER_DEPLOYMENT_ID" \
            --evidence-json="$evidence_root/probe-evidence.json" \
            --approval="${{ inputs.approval }}" \
            --protection-passage-mode="AUTOMATION_BYPASS" \
            > "$evidence_root/probe-raw.json"
          probe_status=$?
          set -e
          if [[ ! -s "$evidence_root/probe-raw.json" ]]; then
            echo 'callback probe 요약을 만들지 못해 실행을 차단합니다.' >&2
            exit 1
          fi
          jq '{
            result: (.result // (if .artifact then "SUCCESS" else null end)),
            failureCode: (.failureCode // null),
            failureStage: (.failureStage // null),
            csrfStatus: (.csrfStatus // null),
            httpStatus: (.httpStatus // (.callbackStatus // null)),
            locationClass: (.locationClass // (.callbackLocationClass // null)),
            headerConfigured: (.headerConfigured // (.headerPresent // null)),
            headerAttachedByRunner: (.headerAttachedByRunner // (.headerPresent // null)),
            protectionPassageMode: (.protectionPassageMode // "NONE"),
            protectionBypassHeaderName: (.protectionBypassHeaderName // "x-vercel-protection-bypass"),
            protectionBypassHeaderPresent: (.protectionBypassHeaderPresent // null),
            callbackAttempted: (.callbackAttempted // (if .artifact then true else null end)),
            callbackStatus,
            sessionAttempted: (.sessionAttempted // (if .artifact then true else null end)),
            runner,
            deploymentReady: (.deploymentReady // null),
            expectedSha: (.expectedSha // (.deploymentSourceSha // null)),
            observedDeploymentSha: (.observedDeploymentSha // (.deploymentSourceSha // null)),
            artifact,
            authErrorClass,
            callbackLocationClass,
            checkedAt,
            credentialSource,
            deploymentId,
            deploymentSourceSha,
            headerName,
            headerPresent,
            requestBuilder,
            sessionState,
            setCookiePresent,
            workflowSourceSha,
            message: (.message // null)
            }' \
            "$evidence_root/probe-raw.json" \
            > "$evidence_root/evidence/callback-summary.json"
          checked_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg runId "$AUTH_CALLBACK_RUN_ID" \
            --arg runAttempt "$AUTH_CALLBACK_RUN_ATTEMPT" \
            --arg eventName "$AUTH_CALLBACK_EVENT_NAME" \
            --arg actor "$AUTH_CALLBACK_ACTOR" \
            --arg triggeringActor "$AUTH_CALLBACK_TRIGGERING_ACTOR" \
            --arg workflowSha "$AUTH_CALLBACK_WORKFLOW_SHA" \
            --arg expectedSha "$AUTH_CALLBACK_EXPECTED_SHA" \
            --arg consumerDeploymentId "$AUTH_CALLBACK_CONSUMER_DEPLOYMENT_ID" \
            --arg consumerTargetUrl "$AUTH_CALLBACK_CONSUMER_URL" \
            --arg checkedAt "$checked_at" \
            --argjson targetUrls "$AUTH_CALLBACK_TARGET_URLS_JSON" \
            --argjson deploymentShas "$AUTH_CALLBACK_DEPLOYMENT_SHAS_JSON" \
            --slurpfile callback "$evidence_root/evidence/callback-summary.json" \
            --slurpfile deployment "$evidence_root/evidence/deployment.json" \
            '{
              runId: $runId,
              runAttempt: $runAttempt,
              eventName: $eventName,
              actor: $actor,
              triggeringActor: $triggeringActor,
              workflowSha: $workflowSha,
              callbackProbeSourceSha: $workflowSha,
              expectedSha: $expectedSha,
              environment: "round-direct-e2e",
              consumerDeploymentId: $consumerDeploymentId,
              consumerTargetUrl: $consumerTargetUrl,
              targetUrls: $targetUrls,
              deploymentShas: $deploymentShas,
              deploymentReady: $deployment[0].ready,
              bindingVerdict: (if $deployment[0].ready == true then "LOCKED_BINDING_VERIFIED" else "BINDING_NOT_READY" end),
              result: ($callback[0].result // null),
              failureCode: ($callback[0].failureCode // null),
              failureStage: ($callback[0].failureStage // null),
              csrfStatus: ($callback[0].csrfStatus // null),
              httpStatus: ($callback[0].httpStatus // $callback[0].callbackStatus),
              locationClass: ($callback[0].locationClass // $callback[0].callbackLocationClass),
              headerConfigured: ($callback[0].headerConfigured // $callback[0].headerPresent),
              headerAttachedByRunner: ($callback[0].headerAttachedByRunner // $callback[0].headerPresent),
              protectionPassageMode: ($callback[0].protectionPassageMode // "NONE"),
              protectionBypassHeaderName: ($callback[0].protectionBypassHeaderName // "x-vercel-protection-bypass"),
              protectionBypassHeaderPresent: ($callback[0].protectionBypassHeaderPresent // null),
              callbackAttempted: ($callback[0].callbackAttempted // null),
              sessionAttempted: ($callback[0].sessionAttempted // null),
              observedDeploymentSha: ($callback[0].observedDeploymentSha // $callback[0].deploymentSourceSha),
              callbackExpectedSha: ($callback[0].expectedSha // null),
              callbackDeploymentReady: ($callback[0].deploymentReady // null),
              credentialSource: ($callback[0].credentialSource // "E2E_TEST_SECRET"),
              headerName: ($callback[0].headerName // "x-e2e-test-token"),
              headerPresent: $callback[0].headerPresent,
              secretPlaintextAccessed: false,
              secretDerivedDiagnosticEmitted: false,
              callbackStatus: $callback[0].callbackStatus,
              callbackLocationClass: $callback[0].callbackLocationClass,
              authErrorClass: $callback[0].authErrorClass,
              setCookiePresent: $callback[0].setCookiePresent,
              sessionState: $callback[0].sessionState,
              checkedAt: $checkedAt
            }' \
            > "$evidence_root/evidence/workflow-summary.json"
          exit "$probe_status"

      - name: 비민감 증거 artifact 업로드
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: auth-callback-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/auth-callback-probe/${{ env.AUTH_CALLBACK_RUN_ID }}/evidence/
          if-no-files-found: error
          retention-days: 7

  auth_identity_cleanup:
    name: auth probe identity cleanup (always, owned-only)
    # Bounded lifecycle closeout: deletes ONLY invocation-owned
    # auth-probe docs (purpose + runId match). Foreign docs are never
    # deleted; missing docs are idempotent success. Runs always() even
    # when seed/session/callback fail or are skipped, so partial seeds
    # cannot leak staging identities. Manifest transfer uses only the
    # redacted (non-sensitive) artifact: no password/hash/email/token/
    # service-account material is ever persisted or logged.
    needs: [auth_identity_seed, session-probe, callback-probe]
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: auth-probe-identities
      cancel-in-progress: false
    environment:
      name: round-direct-e2e
    permissions:
      contents: read
    env:
      AUTH_PROBE_IDENTITY_RUN_ID: auth-probe-${{ github.run_id }}-${{ github.run_attempt }}
      AUTH_PROBE_RUNNER_SHA: ${{ inputs.runner_sha }}
      ROUND_DIRECT_E2E_ENABLED: 'true'
      ROUND_DIRECT_E2E_ENV: preview
      NODE_ENV: test
      VERCEL_ENV: preview
      RAILWAY_ENVIRONMENT_NAME: staging
      FIREBASE_PROJECT_ID: ${{ vars.ROUND_DIRECT_E2E_FIREBASE_PROJECT_ID }}
      ROUND_DIRECT_E2E_ALLOWED_FIREBASE_PROJECTS: ${{ vars.ROUND_DIRECT_E2E_ALLOWED_FIREBASE_PROJECTS }}
    steps:
      - name: runner SHA checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.runner_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6

      - name: 의존성 설치 (identity cleanup only)
        run: pnpm install --frozen-lockfile

      - name: identity manifest 복원 (non-sensitive artifact only)
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: auth-probe-identities-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/auth-probe-identities/${{ env.AUTH_PROBE_IDENTITY_RUN_ID }}/evidence/

      - name: auth probe identities cleanup + verification (owned-only, idempotent)
        shell: bash
        env:
          NON_PRODUCTION_AUTH_PROBE_APPROVAL: ${{ inputs.approval }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.ROUND_DIRECT_E2E_FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          # No secret values are logged. Manifest holds only redacted
          # paths/roles/namespaced storeId/_e2e markers (see seed job).
          evidence_root=".artifacts/auth-probe-identities/$AUTH_PROBE_IDENTITY_RUN_ID"
          mkdir -p "$evidence_root/evidence"
          manifest="$evidence_root/evidence/identity-manifest.json"
          if [[ ! -f "$manifest" ]]; then
            printf '{"action":"cleanup","runId":"%s","status":"not-seeded"}\n' "$AUTH_PROBE_IDENTITY_RUN_ID" \
              > "$evidence_root/evidence/cleanup-summary.json"
            printf 'identity manifest가 없어 cleanup을 건너뜁니다 (not-seeded).\n'
            exit 0
          fi
          set +e
          node scripts/probe-auth-identities.mjs \
            cleanup \
            --manifest="$manifest" \
            > "$evidence_root/cleanup-raw.json"
          cleanup_status=$?
          set -e
          if [[ ! -s "$evidence_root/cleanup-raw.json" ]]; then
            echo 'identity cleanup 요약을 만들지 못해 실행을 차단합니다.' >&2
            exit 1
          fi
          jq '{
            action,
            runId,
            ready,
            deleted,
            skippedForeign,
            missing,
            remainingOwned
            }' \
            "$evidence_root/cleanup-raw.json" \
            > "$evidence_root/evidence/cleanup-summary.json"
          exit "$cleanup_status"

      - name: 비민감 cleanup 증거 artifact 업로드
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: auth-probe-identities-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/auth-probe-identities/${{ env.AUTH_PROBE_IDENTITY_RUN_ID }}/evidence/
          if-no-files-found: error
          retention-days: 7
